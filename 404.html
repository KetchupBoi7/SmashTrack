<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | SmashTrack</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d1117">
<style>
:root{--bg:#0d1117;--ink:#eaf2ee;--mt:#aebbc4;--ac:#4A0D67;--lk:#b388d9}
@media (prefers-color-scheme:light){:root{--bg:#f0f2f5;--ink:#0d1117;--mt:#48525f;--lk:#5b2183}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
.wm{font-size:clamp(34px,8vw,52px);font-weight:800;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.wm span{color:var(--lk)}
h1{margin:28px 0 8px;font-size:clamp(22px,5vw,28px)}
p{margin:0 0 24px;color:var(--mt);max-width:34ch}
a.btn{display:inline-block;background:var(--ac);color:#fff;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:10px}
a.btn:hover{filter:brightness(1.15)}
a.btn:focus-visible{outline:2px solid var(--lk);outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="wm">Smash<span>Track</span></div>
<h1>That page does not exist</h1>
<p>The link may be old or mistyped. Your sessions are safe; nothing was changed.</p>
<a class="btn" href="https://ketchupboi7.github.io/SmashTrack/">Go to SmashTrack</a>
</main>
</body>
</html>
