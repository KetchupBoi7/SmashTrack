<!DOCTYPE html>
<html lang="en-NZ" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmashTrack</title>
<meta name="description" content="ASHS SmashTrack runs badminton, table tennis and squash sessions from one screen.">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmashTrack">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%234A0D67'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial Narrow,Arial,sans-serif' font-weight='700' font-size='38' fill='%23eaf2ee'%3ES%3C/text%3E%3C/svg%3E">
<!--
  ASHS SmashTrack - session coordinator for badminton, table tennis and squash.
  Albany Senior High School. Made by Keshav.

  The whole app is this one file: styles, logic and both fonts are built in, so
  it opens straight off the disk and needs no internet. Everything a session
  records is kept in this browser (localStorage key "ashs.smashtrack.v1"), and
  the season file downloaded from the Session tab is the long-term copy.

  Hosting it (GitHub Pages or similar) works as is. With sw.js,
  manifest.webmanifest and the two icons next to it, the hosted site can be
  installed and keeps working offline after the first visit.
-->
<script>
/* Hosted copies pick up the manifest and service worker when they sit next to
   this file. Opened straight off disk, nothing is registered. */
(function(){
  if(!/^https?:$/.test(location.protocol)) return;
  var l = document.createElement('link');
  l.rel = 'manifest'; l.href = './manifest.webmanifest';
  document.head.appendChild(l);
  var t = document.createElement('link');
  t.rel = 'apple-touch-icon'; t.href = './icon-192.png';
  document.head.appendChild(t);
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
})();
</script>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0d1117;--sf:#151c24;--sf2:#1b2530;--sf3:#222e3a;--ln:#2c3a47;
  --ink:#eaf2ee;--mt:#aebbc4;--mt2:#98a6b0;
  --ac:#4A0D67;--ac2:#3a0a52;--acl:#b388d9;--tl:#00A9CC;--rd:#ff6f61;--am:#ffc24b;
  --sh:0 10px 30px rgba(0,0,0,.35);
  --dp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Controls are at least 40px with a mouse and 44px on touch screens (--tt0,
     below). On tall screens they grow a little, up to 10px more, so spare
     height goes into bigger targets. The top bar stays at the base size. */
  --ct:150px;--tt0:40px;--tt:clamp(var(--tt0),4.6vh,calc(var(--tt0) + 10px));--r1:8px;--r2:12px;
  /* Every page sits in one centred column: content up to --maxw wide, with
     at least --pad of space on the left and right. --gut is that side space. */
  --maxw:1360px;--pad:clamp(12px,3.2vw,48px);
  --gut:max(var(--pad),calc((100% - var(--maxw)) / 2));
  --ez:cubic-bezier(.22,.7,.2,1);
  --hero:#f1eaf9;
  --vh:100vh;
  color-scheme:dark;
}
@supports (height:100dvh){:root{--vh:100dvh}}
@media (pointer:coarse){:root{--tt0:44px}}
html[data-theme=light]{
  --bg:#f0f2f5;--sf:#ffffff;--sf2:#e9ebef;--sf3:#dde0e5;--ln:#cdd2d9;
  --ink:#0d1117;--mt:#48525f;--mt2:#5f6a76;--sh:0 8px 24px rgba(15,20,30,.1);
  --hero:#0d1117;
  color-scheme:light;
}

/* ---------- base ---------- */
html,body{margin:0;padding:0}
/* Only the page itself ever scrolls vertically. Clipping sideways overflow on
   html, not body, keeps body from becoming a second scroller, and while a
   full-screen layer is up (home screen, fullscreen scoreboard) the page
   underneath is locked so its scrollbar doesn't show beside the layer's. */
html{overflow-x:hidden}
html.lock{overflow:hidden}
body{min-height:var(--vh);background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:var(--tl);text-decoration:none}
a:hover{color:var(--ink)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button,select,input,a,[role=button]{transition:background-color .18s var(--ez),border-color .18s var(--ez),color .18s var(--ez),box-shadow .18s,opacity .18s,transform .12s var(--ez)}
button:not(:disabled):active{transform:scale(.975)}
@media (hover:hover){button:not(:disabled):hover{box-shadow:0 3px 12px rgba(0,0,0,.16)}}
button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
input::placeholder{color:var(--mt2)}
input:focus,select:focus{border-color:var(--tl);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tl) 18%,transparent)}
/* Any field under 16px makes iOS Safari zoom the page in on focus. */
@media (pointer:coarse){input,select,textarea{font-size:16px !important}}
:focus-visible{outline:2px solid var(--tl);outline-offset:2px}
[hidden]{display:none !important}
.vis-hide{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}

@keyframes vIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flash{50%{background:rgba(255,111,97,.12)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes cta-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acl) 50%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--acl) 0%,transparent)}}
@keyframes buzzEdge{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@keyframes st-spin{to{transform:rotate(360deg)}}
@keyframes st-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0s !important;transition:none !important}
  button:not(:disabled):active{transform:none}
}

/* ---------- even grids ----------
   Fixed sets (stat tiles, steps, toggles, shortcut rows) only ever use column
   counts that divide them exactly, and variable sets (courts) balance their
   rows, so no grid is left with a short, lopsided last row. The script measures
   each .bal box and sets --cols; the last row stretches to close any gap. */
.bal{display:flex;flex-wrap:wrap;gap:var(--g,12px);--cols:1}
.bal>*{flex:1 1 calc((100% - (var(--cols) - 1) * var(--g,12px)) / var(--cols) - .5px);min-width:0}
.bal.rg0{row-gap:0}
.bal.ctr{justify-content:center}
.bal.ctr>*{flex-grow:0}

/* ---------- shell ---------- */
#st-app{min-height:var(--vh);display:flex;flex-direction:column;background:var(--bg)}
.top{position:sticky;top:0;z-index:60}
.phone .top{position:relative}
.saveerr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--rd);color:#1a0705;font-size:13px;font-weight:600;line-height:1.35}
.saveerr i{flex:none;width:18px;height:18px;border-radius:50%;background:rgba(26,7,5,.22);display:grid;place-items:center;font-family:var(--dp);font-size:13px;font-style:normal}
.hdr{position:relative;display:flex;align-items:center;gap:clamp(10px,2vw,20px);background:var(--sf);border-bottom:1px solid var(--ln);padding:10px var(--gut)}
.brand{display:flex;flex-direction:column;justify-content:center;flex:none;cursor:pointer;border-radius:var(--r1);padding:2px 6px;margin:-2px -6px;background:transparent;border:0;color:var(--ink);text-align:left}
.brand:hover{background:var(--sf2)}
@media (hover:hover){.brand:not(:disabled):hover{box-shadow:none}}
.wm{font-family:var(--dp);font-weight:800;font-size:22px;line-height:.9;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.wm span{color:var(--acl)}
.wsub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt);margin-top:4px;white-space:nowrap}
.nav{display:flex;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;flex:none;white-space:nowrap;background:transparent;color:var(--mt);padding:8px 12px;border-radius:var(--r1);font-weight:600;font-size:13px;border:0;cursor:pointer;min-height:var(--tt0)}
.nav button:hover{background:var(--sf2);color:var(--ink)}
.nav button[aria-current=page]{background:var(--ac);color:#fff}
.nav button[aria-current=page]:hover{background:var(--ac2)}
@media (max-width:720px){.nav button{padding:8px 9px}}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.hpill{border:1px solid var(--ln);border-radius:999px;background:var(--sf2);padding:0 16px;min-height:var(--tt0);display:flex;align-items:center;gap:8px;flex:none;font-size:12px;white-space:nowrap}
.hpill .dot{width:7px;height:7px;border-radius:50%;display:block}
.hpill b{font-family:var(--dp);font-weight:800;font-size:14px}
.hpill .m{color:var(--mt)}
.hpill .sep{width:1px;height:14px;background:var(--ln);display:block}
.gear{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);border-radius:999px;min-height:var(--tt0);min-width:var(--tt0);padding:0 16px;font-size:13px;font-weight:600;cursor:pointer}
.gear:hover{border-color:var(--mt2)}
.gear[aria-expanded=true]{border-color:var(--ac);background:var(--ac);color:#fff}
.gear svg{width:16px;height:16px;flex:none}
.gear.ico{padding:0}
.ptop{display:flex;align-items:center;gap:10px;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px var(--pad);position:relative}
.ptop .hpill{padding:0 12px}

main{flex:1;min-width:0;padding:clamp(12px,1.8vw,20px) var(--gut) 24px;width:100%;display:flex;flex-direction:column}
/* Every view fills the height below the top bar. When a page is shorter than
   the screen, its .grow element takes the spare height: the courts on the
   dashboard (bigger tap areas), the leaderboard on Stats, the empty state on
   History. Longer pages just scroll as before. */
.view{animation:vIn .4s var(--ez) both;display:flex;flex-direction:column;gap:12px;flex:1 0 auto}
.view>.grow{flex:1 0 auto}
.vh{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.vh h1{font-family:var(--dp);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:24px;line-height:1.15;margin:0;flex:none}
.vh p{color:var(--mt);font-size:12px;margin:0;max-width:70ch}

/* ---------- shared pieces ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2);box-shadow:var(--sh);min-width:0}
.card.col{display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:8px 12px;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap;min-height:44px}
.ch h2{margin:0;font-family:var(--dp);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:15px;line-height:1.3}
/* Header buttons stay compact so every card header lines up at one height;
   the invisible ::after keeps the full tap area on touch screens. */
.ch>.btn.cpt{position:relative;min-height:32px;padding:6px 12px;font-size:13px;margin-block:-7px}
.ch>.btn.cpt::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(100%,var(--tt));transform:translateY(-50%)}
.cb{padding:10px 14px}
.eb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt)}
.lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt);font-weight:600}
.note{font-size:11px;color:var(--mt2);line-height:1.45;text-wrap:pretty}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);border-radius:var(--r1);padding:10px 16px;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;min-height:var(--tt)}
.btn:hover{border-color:var(--mt2)}
.btn.s{padding:8px 12px;font-size:13px}
.btn.p{border-color:var(--ac);background:var(--ac);color:#fff}
.btn.p:hover{background:var(--ac2);border-color:var(--ac)}
.btn.d{border-color:var(--rd);background:transparent;color:var(--rd)}
.btn.d:hover{background:color-mix(in srgb,var(--rd) 12%,transparent)}
.btn.r{border-radius:999px}
.btn.w{width:100%}
.fld{background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r1);color:var(--ink);padding:8px 12px;font-size:13px;min-height:var(--tt);min-width:0}
select.fld{cursor:pointer}
.seg{display:flex;background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r1);padding:4px;gap:2px;width:100%}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--mt);font-size:13px;font-weight:600;padding:8px 12px;border-radius:var(--r1);cursor:pointer;min-height:var(--tt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
.seg.dp button{font-family:var(--dp);text-transform:uppercase;letter-spacing:.04em}
.seg.lock button{cursor:not-allowed;color:var(--mt2)}
.seg.lock button[aria-pressed=true]{color:#fff}
.step{display:flex;align-items:center;background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r1);overflow:hidden;width:100%}
.step button{background:var(--sf3);border:0;font-size:18px;width:38px;min-height:var(--tt);color:var(--ink);cursor:pointer;flex:none;line-height:1}
.step button:hover{background:var(--ln)}
.step b{flex:1;text-align:center;font-family:var(--dp);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.step.lock button,.step.lock b{color:var(--mt2)}
.step.lock button{cursor:not-allowed}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;background:none;border:0;border-top:1px solid var(--ln);width:100%;text-align:left;cursor:pointer;color:inherit;min-height:var(--tt)}
@media (hover:hover){.trow:not(:disabled):hover{box-shadow:none}}
.trow b{font-weight:600;font-size:13px;display:block}
.trow small{font-size:11px;color:var(--mt);margin-top:4px;display:block;line-height:1.35}
.tog{position:relative;width:46px;height:26px;flex:none;border-radius:999px;background:var(--sf3);border:1px solid var(--ln);transition:.18s;display:block}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mt);transition:.18s}
[aria-checked=true]>.tog{background:var(--ac);border-color:var(--ac)}
[aria-checked=true]>.tog::after{background:#fff;transform:translateX(20px)}
.sw{display:inline-flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-height:var(--tt);color:var(--mt2);font-size:13px}
.sw span:first-child{min-width:24px;text-align:right}
.sw.lock{cursor:not-allowed}
.sw.lock .tog{opacity:.55}
.empty{text-align:center;color:var(--mt);padding:40px 20px;font-size:12px;display:grid;place-content:center}
.empty b{font-family:var(--dp);font-weight:800;font-size:14px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.alert{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r2);background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.32)}
.alert .bang{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,194,75,.18);color:var(--am);font-family:var(--dp);font-weight:800;font-size:18px;line-height:1}
.alert .at{flex:0 1 auto;min-width:0;font-family:var(--dp);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:17px;line-height:1.1;color:var(--am);text-wrap:pretty}
.alert .ab{flex:1 1 240px;min-width:0;font-size:12px;color:var(--mt);line-height:1.5;text-wrap:pretty}
.alert .btn{flex:none;border-color:var(--am);background:transparent;color:var(--am);min-height:44px}
.alert .btn:hover{background:rgba(255,194,75,.14)}
.cnt{font-family:var(--dp);font-weight:800;font-size:13px;color:#fff;background:var(--ac);border-radius:999px;min-width:22px;height:20px;padding:0 8px;display:inline-grid;place-items:center}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt2);text-align:center;padding:8px 12px;font-weight:600;border-bottom:1px solid var(--ln);white-space:nowrap}
.tbl th.l{text-align:left;letter-spacing:.1em}
.tbl td{padding:12px;border-bottom:1px solid var(--ln);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.rk{font-family:var(--dp);font-weight:800;font-size:16px}
.tbl td.nm{text-align:left;font-weight:600;font-variant-numeric:normal}
.tbl td.nm span{color:var(--mt2);font-size:12px}
.tbl td.w{color:var(--tl);font-weight:600}
.tbl td.lo{color:var(--mt)}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--sf2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
<style>
/* ---------- dashboard ---------- */
.champ{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,210,74,.14),color-mix(in srgb,var(--ac) 20%,transparent));border:1px solid var(--am);border-radius:var(--r2);padding:10px 14px}
.champ .first{font-family:var(--dp);font-weight:800;font-size:30px;color:var(--am);line-height:1}
.champ .cl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--am);font-weight:600}
.champ .cn{font-family:var(--dp);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.champ .btn{margin-left:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;align-items:stretch}
.clock{background:linear-gradient(135deg,var(--sf2),var(--sf));border:1px solid var(--ln);border-radius:var(--r2);padding:10px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh)}
.clock.amber{border-color:var(--am)}
.clock.zero{border-color:var(--rd);animation:flash .9s steps(1) infinite}
.clock .row{display:flex;align-items:stretch;gap:12px;flex:1;min-height:0;container-type:inline-size}
.clock .dw{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.clock .dg{font-family:var(--dp);font-weight:800;font-size:clamp(58px,29cqw,200px);line-height:.8;font-variant-numeric:tabular-nums;white-space:nowrap;padding:.06em 0}
.clock .cbt{display:flex;flex-direction:column;gap:8px;flex:none;width:min(104px,30%);min-width:76px;justify-content:center}
.clock .cbt .btn{padding:0 12px;font-size:13px;flex:1 1 auto}
.clock .cbt .btn.p:hover{background:var(--ac2)}
.clock .cbt .btn:not(.p):hover{background:var(--sf3);border-color:var(--ln)}
.pulse{animation:cta-pulse 1.9s ease-in-out infinite}
.rc .cb{display:flex;flex-direction:column;gap:8px;flex:1}
.rc .sn{font-family:var(--dp);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.rc .sd{color:var(--mt);font-size:12px;margin-top:4px}
.gen{display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:var(--r1);padding:14px 16px;font-family:var(--dp);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.05em;line-height:1;cursor:pointer;width:100%;min-height:calc(var(--tt) + 12px)}
.gen:not(:disabled):hover{background:var(--ac2);transform:translateY(-1px)}
.gen:disabled{border-color:var(--ln);background:var(--sf3);color:var(--mt2)}
.rc .gen{margin-top:4px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:auto;padding-top:4px}
@media (max-width:360px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rgrid .btn{min-width:0}
.rgrid .btn.on{border-color:var(--tl);background:var(--tl);color:#04222a}
.subbar{display:flex;align-items:center;gap:12px;border:1.5px solid var(--tl);color:var(--tl);border-radius:999px;padding:8px 8px 8px 20px;font-size:13px;font-weight:600;line-height:1.4}
.subbar button{margin-left:auto;flex:none;border:1px solid var(--tl);background:transparent;color:var(--tl);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;min-height:var(--tt)}
.courts{container-type:inline-size;align-content:stretch}
.court{background:linear-gradient(180deg,var(--sf),var(--sf2));border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;animation:rise .26s var(--ez) both}
.court.half{border-color:var(--am)}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--ln);gap:8px;min-height:39px}
.cno{font-family:var(--dp);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--mt)}
.cno b{color:var(--ink)}
.cst{display:flex;align-items:center;gap:8px;flex:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.swapc{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--ln);background:var(--sf2);color:var(--mt);cursor:pointer;padding:0;flex:none}
.swapc::after{content:"";position:absolute;inset:-11px}
.swapc:hover{border-color:var(--mt2);color:var(--ink)}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);min-height:var(--ct);align-items:stretch;flex:1}
.side{position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px 12px;min-height:max(var(--ct),132px);height:100%;text-align:left;transition:background .13s,box-shadow .13s,opacity .3s;outline-offset:-3px}
.side.b{align-items:flex-end;text-align:right}
.side.live{cursor:pointer}
.side.live:hover{background:color-mix(in srgb,var(--tl) 18%,transparent);box-shadow:inset 0 0 0 2px var(--tl)}
.side.live:active{background:color-mix(in srgb,var(--tl) 32%,transparent)}
.side .sl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt2)}
.pn{font-family:var(--dp);font-weight:800;font-size:clamp(22px,calc((100cqw - (var(--cols) - 1) * 12px) / var(--cols) * .1),46px);line-height:1.05;overflow-wrap:anywhere;border-radius:var(--r1);padding:0 4px;margin:0 -4px}
.subon .pn{cursor:pointer}
.subon .pn:hover{background:color-mix(in srgb,var(--tl) 22%,transparent)}
.pn.pick,.subon .pn.pick:hover{background:var(--tl);color:#04222a}
.tapw{display:flex;align-items:center;gap:7px;margin-top:2px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tl)}
.tapw i{width:15px;height:15px;border-radius:50%;border:2px solid var(--tl);display:block;flex:none}
.res{margin-top:2px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.waitc{font-size:14px;font-weight:600;color:var(--mt2);line-height:1.4;text-wrap:pretty}
.divd{background:repeating-linear-gradient(180deg,var(--mt2) 0 4px,transparent 4px 9px);opacity:.5}
.cfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--ln)}
.cfoot.brk{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--am)}
.cfoot.brk i{width:7px;height:7px;border-radius:50%;background:var(--am);display:block;flex:none}
.tag{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--acl);background:color-mix(in srgb,var(--ac) 28%,transparent);border:1px solid color-mix(in srgb,color-mix(in srgb,var(--ac) 50%,var(--acl)) 40%,transparent);padding:4px 8px;border-radius:999px}
.copen{flex:1;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px;text-align:center}
.copen b{font-family:var(--dp);font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--mt)}
.copen span{font-size:12px;color:var(--mt2)}
.low{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;align-items:stretch}
.chips{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
.grp{display:inline-flex;align-items:center}
.qc{display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r1);padding:8px 12px;font-size:13px;color:var(--ink);min-height:var(--tt);cursor:pointer}
.qc .pos{font-family:var(--dp);font-weight:800;color:var(--mt2);font-size:12px}
.qc .nm{font-weight:600}
.qc .g{font-size:11px;color:var(--mt)}
.qc.next{border-color:var(--am)}
.qc.pick{background:color-mix(in srgb,var(--tl) 20%,transparent);border-color:var(--tl)}
.qc.away{border-style:dashed;color:var(--mt2);opacity:.6}
.qc.pa,.qc.pb{border-color:var(--tl);background:color-mix(in srgb,var(--tl) 10%,transparent);gap:6px}
.qc.pa{border-radius:var(--r1) 6px 6px var(--r1);border-right-color:transparent}
.qc.pb{border-radius:6px var(--r1) var(--r1) 6px;border-left-color:transparent}
.unp{display:inline-grid;place-items:center;width:24px;min-height:var(--tt);margin:0 -3px;position:relative;z-index:1;background:transparent;flex:none;border:0;cursor:pointer;padding:0}
@media (hover:hover){.unp:not(:disabled):hover{box-shadow:none}}
.unp span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--tl);color:#04222a;font-size:10px;font-weight:800}
.qempty{width:100%;color:var(--mt);font-size:13px;text-align:center;padding:16px 8px}
.brk-row{display:flex;gap:12px;align-items:stretch;overflow-x:auto;padding:2px 2px 8px}
.bcol{flex:1 1 0;min-width:158px;display:flex;flex-direction:column}
.bcol h3{font-family:var(--dp);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mt2);text-align:center;padding-bottom:8px;margin:0 0 12px;border-bottom:1px solid var(--ln);flex:none}
.bms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bm{border:1px solid var(--ln);background:var(--sf2);border-radius:var(--r1);overflow:hidden}
.bm.open{border-color:var(--acl)}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:13px;font-weight:600}
.bm div+div{border-top:1px solid var(--ln)}
.bm span{color:var(--mt2);font-weight:600;flex:none}

/* ---------- session ---------- */
.sf .cb{container-type:inline-size;display:flex;flex-direction:column;gap:10px}
.sfr{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.sfr+.sfr{padding-top:10px;border-top:1px solid var(--ln)}
.sfs{display:flex;align-items:baseline;gap:7px;flex:none}
.sfs b{font-family:var(--dp);font-weight:800;font-size:22px;line-height:1}
.sfs span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mt2);font-weight:600}
.sfb{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.sfb .btn,.sfr .btn{min-height:44px}
.sfw{flex:1 1 220px;min-width:0;font-size:12px;color:var(--mt2);line-height:1.4;text-wrap:pretty}
@container (max-width:860px){.sfb{flex-basis:100%;margin-left:0}.sfb .btn{flex:1 1 0}}
@container (max-width:540px){.sfb{flex-direction:column}.sfr .btn.d{flex:1 1 100%}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:5px 11px;border-radius:999px}
.pill.amb{background:rgba(255,194,75,.14);color:var(--am);border:1px solid rgba(255,194,75,.4)}
.pill.ok{background:color-mix(in srgb,var(--tl) 12%,transparent);color:var(--tl);border:1px solid color-mix(in srgb,var(--tl) 35%,transparent)}
.ps{container-type:inline-size}
/* Toolbars follow one order across the site: title, then search and sort on
   the left, a gap, then adding and actions on the right. */
.ps .ch{display:grid;grid-template-columns:auto minmax(150px,240px) auto 1fr minmax(170px,260px) auto auto;grid-template-areas:"h q s . a b t";align-items:center}
.ps .ch>h2{grid-area:h}.ps .ch>.q{grid-area:q}.ps .ch>.so{grid-area:s}.ps .ch>.ad{grid-area:a}.ps .ch>.ab{grid-area:b}.ps .ch>.st{grid-area:t}
.ps .ch .btn{white-space:nowrap}
@container (max-width:1000px){.ps .ch{grid-template-columns:minmax(0,1fr) minmax(96px,auto);grid-template-areas:"h t" "q s" "a b"}}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--sf2)}
.selbar .n{font-size:12px;color:var(--mt);margin-right:4px}
.selbar .btn{border-radius:999px;background:var(--sf);padding:8px 14px;font-size:13px}
.selbar .btn.t{border-color:var(--tl);background:transparent;color:var(--tl)}
.selbar .btn.d{background:transparent;margin-left:auto}
.selbar .fld{border-radius:999px;width:150px;background:var(--sf)}
.chint{font-size:12px;color:var(--mt);margin-bottom:12px}
.pc{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2);cursor:grab;font-size:13px;font-weight:600;color:var(--mt2);min-height:var(--tt);border-style:dashed;user-select:none}
.pc:hover{border-color:var(--mt2)}
.pc.in{border-style:solid;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ink)}
.pc.sel{border-style:solid;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 34%,transparent)}
.pc .dot{width:7px;height:7px;border-radius:50%;flex:none;display:block;background:transparent}
.pc.in .dot{background:var(--tl)}
.pc .ck{width:16px;height:16px;border-radius:var(--r1);border:1.5px solid var(--mt2);flex:none;display:block}
.pc.sel .ck{border-color:var(--ac);background:var(--ac)}
.pc .g{font-size:11px;color:var(--mt);font-weight:600}
.pc.pa,.pc.pb{border-style:solid;border-color:var(--tl);background:color-mix(in srgb,var(--tl) 10%,transparent)}
.pc.pa{border-radius:999px 6px 6px 999px;border-right-color:transparent}
.pc.pb{border-radius:6px 999px 999px 6px;border-left-color:transparent}
.unp.lg{width:26px;margin:0 -4px}
.unp.lg span{width:22px;height:22px;font-size:11px}
.noply{width:100%;color:var(--mt);font-size:13px;text-align:center;padding:8px;min-height:72px;display:grid;place-items:center}
.g8{--g:8px}.hg{--g:clamp(12px,1.4vw,16px)}
.pc.pa.sel,.pc.pb.sel{background:color-mix(in srgb,var(--ac) 34%,transparent)}
/* Game settings: a play style bar, then four equal panels of four rows. Every
   row is name and note on the left, control on the right, so rows, panels and
   control edges all line up. */
.gset{container-type:inline-size}
.sbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.stc{display:flex;flex-direction:column;justify-content:center;gap:2px;border:1px solid var(--ln);background:var(--sf2);border-radius:var(--r1);padding:9px 12px;min-height:56px;cursor:pointer;text-align:left;width:100%;min-width:0}
.stc:hover{border-color:var(--mt2)}
.stc .n{font-family:var(--dp);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;color:var(--mt);display:block}
.stc .d{font-size:12px;line-height:1.3;color:var(--mt2);display:block}
.stc[aria-pressed=true]{background:var(--ac);border-color:var(--ac)}
.stc[aria-pressed=true] .n{color:#fff}
.stc[aria-pressed=true] .d{color:rgba(255,255,255,.75)}
.gsg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
.gp{display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:var(--r1);min-width:0}
.gp>header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;padding:10px 14px;background:var(--sf2);border-bottom:1px solid var(--ln);border-radius:var(--r1) var(--r1) 0 0}
.gp>header h3{margin:0;font-family:var(--dp);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;line-height:1.3}
.grs{flex:1;display:grid;grid-auto-rows:1fr}
.gr{display:grid;grid-template-columns:minmax(0,1fr) 180px;align-items:center;gap:14px;padding:10px 14px;min-height:64px}
.gr+.gr{border-top:1px solid var(--ln)}
.gr>div:first-child>b{display:block;font-size:13px;font-weight:600}
.gr .note{margin-top:2px}
.gr .sw{justify-self:end}
.gr .seg button{min-height:calc(var(--tt) - 10px);padding:6px 8px}
@container (max-width:900px){.gsg{grid-template-columns:1fr}}
@container (max-width:620px){.sbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:420px){.gr:not(:has(.sw)){grid-template-columns:1fr;gap:8px}.gr:has(.sw){grid-template-columns:minmax(0,1fr) auto}}
.rdy{display:flex;flex-direction:column;gap:12px;padding:12px 14px}
.rdy .alert{border-radius:var(--r1)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:var(--r1);background:var(--sf2);border:1px solid var(--ln);min-width:0}
.num b{font-family:var(--dp);font-weight:800;font-size:30px;line-height:1}
.num span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mt2);font-weight:600}

/* ---------- scoreboard ---------- */
.sbv{display:flex;flex-direction:column;flex:1;background:var(--bg);gap:12px}
.sbv.fs{position:fixed;inset:0;z-index:200;gap:0}
.sbg{display:grid;grid-template-columns:minmax(0,1fr) clamp(20px,3.5vw,40px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);flex:1;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
.sbv.fs .sbg{border-radius:0;margin-bottom:12px}
/* Each side is a size container, so the score fills the room it has. */
.sbs{container-type:size;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:manipulation;position:relative;transition:background .12s;min-width:0;min-height:0;overflow:hidden}
.sbs.a{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.sbs.a:hover{background:color-mix(in srgb,var(--ac) 36%,transparent)}
.sbs.b{background:color-mix(in srgb,var(--tl) 14%,transparent)}
.sbs.b:hover{background:color-mix(in srgb,var(--tl) 26%,transparent)}
.sbs .sn{position:absolute;top:clamp(10px,4cqh,28px);left:12px;right:12px;font-size:clamp(12px,4.2cqmin,22px);line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--mt);font-weight:600;text-align:center;overflow-wrap:anywhere}
/* Height-led: about three quarters of the side, kept clear of the name and
   the Undo button, and narrowed when a score reaches three digits. */
.sbs .sd{font-family:var(--dp);font-weight:800;font-size:max(40px,min(84cqh,calc(113.5cqh - 132px),calc(176cqw / var(--n,2))));line-height:.78;font-variant-numeric:tabular-nums;letter-spacing:-.03em;pointer-events:none;padding-top:.04em}
.sbs.a .sd{color:var(--acl)}
.sbs.b .sd{color:var(--tl)}
.sbs .un{position:absolute;bottom:clamp(10px,3.5cqh,22px);left:0;right:0;margin:0 auto;width:max-content;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.28);color:rgba(255,255,255,.75);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:8px 16px;cursor:pointer;min-height:var(--tt)}
.sbs .un:hover{background:rgba(0,0,0,.5);color:#fff}
.sbvs{display:flex;align-items:center;justify-content:center;background:var(--sf2);border-left:1px solid var(--ln);border-right:1px solid var(--ln)}
.sbvs span{font-family:var(--dp);font-weight:800;font-size:clamp(12px,2cqw,16px);text-transform:uppercase;color:var(--mt2);letter-spacing:.08em;writing-mode:vertical-rl}
/* Phones stand upright, so the two sides stack and each gets the full width. */
.phone .sbg{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 30px minmax(0,1fr)}
.phone .sbvs{border-left:0;border-right:0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.phone .sbvs span{writing-mode:horizontal-tb}
.sbb{display:grid;grid-template-columns:repeat(3,minmax(0,210px));justify-content:center;gap:8px;padding:0 12px 8px}
.sbb .btn{padding:10px 12px}
.sbb .btn:not(.p):hover{background:var(--sf3);border-color:var(--ln)}

/* ---------- stats ---------- */
.vh .btn.d{margin-left:auto}
.sum{background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r2);padding:12px 14px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.sum b{font-family:var(--dp);font-weight:800;font-size:28px;line-height:1;display:block}
.sum .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mt2);margin-top:8px}
.sum .s{font-size:12px;color:var(--mt);margin-top:4px;line-height:1.4;text-wrap:pretty;overflow-wrap:anywhere}
.lbh{justify-content:flex-start}
.card.grow>.empty{flex:1}
.lbh .fld[type=search]{flex:1 1 150px;max-width:240px}
@media (max-width:560px){.lbh{display:grid;grid-template-columns:minmax(0,1fr) auto}.lbh h2{grid-column:1/-1}.lbh .fld[type=search]{max-width:none}}
.strk{font-family:var(--dp);font-weight:800;font-size:12px;padding:4px 8px;border-radius:999px}

/* ---------- history ---------- */
.hctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.hctl .fld[type=search]{flex:1 1 170px;max-width:260px}
.hc{background:var(--sf2);border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s var(--ez),border-color .2s;content-visibility:auto;contain-intrinsic-size:auto 230px}
.hc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--tl) 45%,transparent)}
.hct{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--ln);background:var(--sf);font-size:12px}
.hct b{font-family:var(--dp);font-weight:800;font-size:14px;color:var(--mt2)}
.hct .sty{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acl);background:color-mix(in srgb,var(--ac) 30%,transparent);border:1px solid color-mix(in srgb,color-mix(in srgb,var(--ac) 50%,var(--acl)) 40%,transparent);padding:4px 8px;border-radius:999px}
.hct time{margin-left:auto;color:var(--mt2);font-size:12px;font-variant-numeric:tabular-nums}
.hcb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;flex:1}
.hsd{padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-width:0}
.hsd.w{background:color-mix(in srgb,var(--tl) 9%,transparent)}
.avs{display:flex;justify-content:center}
.hsd.l .avs{filter:grayscale(.65);opacity:.75}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--dp);font-weight:800;font-size:15px;border:2px solid var(--sf2)}
.av+.av{margin-left:-11px}
.hsd .hn{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
.hsd.l .hn{color:var(--mt)}
.rp{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
.rp.w{color:var(--tl);background:color-mix(in srgb,var(--tl) 16%,transparent);border:1px solid color-mix(in srgb,var(--tl) 40%,transparent)}
.rp.l{color:var(--mt2);background:var(--sf3);border:1px solid var(--ln)}
.hvs{display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--dp);font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--mt2);background:repeating-linear-gradient(var(--ln),var(--ln) 4px,transparent 4px,transparent 9px) center/1px 100% no-repeat}
.hvs span{background:var(--sf2);padding:4px 0}
.hcf{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--ln);background:var(--sf);font-size:12px;color:var(--mt2)}
.hcf span{min-width:0;line-height:1.4;text-wrap:pretty;overflow-wrap:anywhere}
.hcf button{display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:auto;border:1px solid var(--ln);background:var(--sf2);color:var(--mt);font-size:13px;font-weight:600;letter-spacing:.03em;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:var(--tt)}
.hcf button:hover{border-color:var(--acl);color:var(--ink)}
.hempty{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r2)}
.hmore{height:1px;margin-top:-1px}

/* ---------- about ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--ln);border-radius:var(--r2);padding:clamp(14px,2.2vw,20px);background:linear-gradient(135deg,var(--sf2),var(--sf));display:flex;align-items:center;gap:clamp(14px,2vw,22px);flex-wrap:wrap}
.hero .ht{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:9px}
.hero .ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acl);font-weight:600}

<script>
'use strict';
/* =====================================================================
   SmashTrack core: data model, persistence and session logic.
   Ported from the reference prototype nearly line for line, so existing
   season files and saved sessions open unchanged.

const K = 'ashs.smashtrack.v1';
// Kept in their own keys so neither ever reads or writes the season file.
const WK = 'ashs.smashtrack.welcome';
const PK = 'ashs.smashtrack.prefs';
// Per tab: the home screen greets each new visit, but a reload mid-match

const HK = 'ashs.smashtrack.home';

const ST = {
  casual:{n:'Casual', d:'fair rotation'},
  kotc:{n:'King of the Court', d:'winners stay on'},
  tour:{n:'Tournament', d:'single-elimination knockout'},
  league:{n:'League', d:'round robin'}
};
const COMP = ['tour','league'];
const VIEWS = [['dash','Dashboard','Courts','C'],['sess','Session','Session','S'],['stats','Stats','Stats','%'],['hist','History','History','H'],['score','Scoreboard','Score','#'],['about','About','About','?']];
// Every rebindable action: [id, what it does, default key token].
// Ids are stored in the season file, so never renumber or reuse one.
const KEYS = [
  ['timer','Start or pause clock','space'],
  ['round','Generate next round','g'],
  ['pta','Point to side A','a'],
  ['ptb','Point to side B','b'],
  ['undo','Undo last point','z'],
  ['sbreset','Scoreboard to 0-0','0'],
  ['swap','Swap sides','x'],
  ['fs','Fullscreen scoreboard','f'],
  ['save','Download season file','d'],
  ['v.dash','Go to Courts','1'],
  ['v.sess','Go to Session','2'],
  ['v.stats','Go to Stats','3'],
  ['v.hist','Go to History','4'],
  ['v.score','Go to Scoreboard','5'],
  ['v.about','Go to About','6']
];
const KTOK = /^([a-z0-9]|space|escape|enter)$/;
const ACCENTS = ['#4A0D67','#1e3a8a','#0f5132','#7c2d12'];
const HEX = /^#[0-9a-f]{6}$/i;

let D = null;      // persisted session data (the season file)
let U = null;      // view-only state: never saved
let P = null;      // per-device display settings
let loadFail = false, restored = false, saveN = 0;

/* ---------- small helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }

function plural(n, one, many){ return n + (n === 1 ? one : many); }

/* ---------- data model ---------- */
function fresh(){
  return {
    v:'dash', players:[], pairs:{}, courts:[{id:'c1',m:null},{id:'c2',m:null},{id:'c3',m:null}],
    hist:[], gn:0, met:{}, ptn:{}, round:0, comp:null,
    sessions:[], savedAt:0, touchedAt:0, club:'Albany Senior High School',
    s:{ fmt:'doubles', courts:3, len:12, brk:0,
        o:{newOpp:true,skill:false,sound:true,noPtn:true,rest:true,auto:false,courtWarn:true,lockScores:false},
        style:'casual',
        casual:{rounds:0,cap:0,rest:0,sortBy:'wait'},
        kotc:{cap:3,cool:0,src:'fewest',noRematch:false},
        tour:{seed:'random',third:true,cons:false,confirm:false},
        league:{rounds:1,pools:'one',finals:'off',confirm:false} },
    t:{len:720,left:720,run:false,end:0},
    sb:{a:0,b:0,na:'Side A',nb:'Side B',h:[]},
    keys:{},

// Recursive merge so a future version adding a nested setting still gets its
// default backfilled instead of reading undefined off an old saved session.
function dmerge(base, over){
  if(!over || typeof over !== 'object' || Array.isArray(over)) return base;
  const out = Object.assign({}, base);
  Object.keys(over).forEach(k => {
    const b = out[k], o = over[k];

const pick1 = (v, opts, def) => opts.indexOf(v) >= 0 ? v : def;
const bool = (v, def) => typeof v === 'boolean' ? v : def;
// Single gate for anything entering state from disk or an imported file.

    .filter(p => p && typeof p === 'object' && p.id != null && typeof p.name === 'string' && p.name.trim())
    .slice(0, 400)

  const rc = Array.isArray(raw.courts) && raw.courts.length ? raw.courts : f.courts;
  d.courts = rc.slice(0, 12).map((c, i) => {
    const court = {id:(c && c.id) ? String(c.id) : 'c' + (i+1), m:null};
    if(c && c.m && Array.isArray(c.m.t1)){
      const t1 = c.m.t1.filter(x => ids.has(x)), t2 = (Array.isArray(c.m.t2) ? c.m.t2 : []).filter(x => ids.has(x));
      if(t1.length) court.m = Object.assign({}, c.m, {t1, t2, tags:Array.isArray(c.m.tags) ? c.m.tags.map(String).slice(0,4) : []});
    }
    return court;
  });
  const strs = a => Array.isArray(a) ? a.map(x => String(x)) : [];
  d.hist = (Array.isArray(raw.hist) ? raw.hist : [])
    .filter(h => h && h.id && Array.isArray(h.w) && Array.isArray(h.l)).slice(0, 4000)
    .map(h => Object.assign({}, h, {id:String(h.id), n:Math.max(0,+h.n||0), w:strs(h.w), l:strs(h.l), wi:strs(h.wi), li:strs(h.li),
      style:ST[h.style] ? h.style : 'casual', fmt:h.fmt === 'singles' ? 'singles' : 'doubles',
      lbl:String(h.lbl || 'Court'), dur:Math.max(0,+h.dur||0), ts:Math.max(0,+h.ts||0), comp:!!h.comp}));
  d.sessions = (Array.isArray(raw.sessions) ? raw.sessions : [])
    .filter(x => x && x.id).slice(0, 500)
    .map(x => ({id:String(x.id), ts:+x.ts || 0, n:Math.max(0, +x.n || 0), players:Math.max(0, +x.players || 0), style:ST[x.style] ? x.style : 'casual'}));

  d.touchedAt = Math.max(0, +raw.touchedAt || 0);

function load(){

function save(d){

// Every change goes through here: copy, apply, stamp, save, redraw.

/* ---------- season file ---------- */
function liveMatches(d){ return d.hist.filter(h => !h.sid).length; }
function dirty(d){ return (d.touchedAt || 0) > (d.savedAt || 0) && (d.hist.length > 0 || d.players.length > 0); }
function writeBlob(snap){
  try{
    const out = clone(snap);
    delete out._added; delete out._short; out.swap = null; out.v = 'dash';
    const t = new Date();
    const stamp = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
    const b = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url; a.download = 'smashtrack-season-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  }catch(e){ toast('Download failed', 'bad'); return false; }
}
function downloadSeason(){
  if(!writeBlob(D)) return;
  set(x => { x.savedAt = Date.now(); }, 'Season file downloaded', 'ok');
}
function endSession(){
  const n = liveMatches(D);

  ask('End this session?',
    n + ' match' + (n === 1 ? '' : 'es') + ' get filed into your season, the courts are cleared and your season file downloads. Player stats carry over to next time.',
    'End and download',
    () => {
      set(x => {
        const sid = uid();
        x.hist.forEach(h => { if(!h.sid) h.sid = sid; });
        x.sessions.unshift({id:sid, ts:Date.now(), n, players:x.players.length, style:x.s.style});
        x.courts.forEach(c => { c.m = null; });
        x.comp = null; x.round = 0; x.swap = null;
        x.t = {len:x.t.len, left:x.t.len, run:false, end:0};

function importFile(file){

    const nd = sanitize(j);
    if(!nd || !Array.isArray(j.players)){ toast('That file is not a SmashTrack season file', 'bad'); return; }
    const cur = D;
    const stale = nd.hist.length < cur.hist.length || nd.sessions.length < cur.sessions.length;
    ask(
      stale ? 'That file holds less than this browser' : 'Open this season file?',
      (stale
        ? 'The file has ' + nd.hist.length + ' matches across ' + nd.sessions.length + ' session' + (nd.sessions.length === 1 ? '' : 's') + ', but this browser currently holds ' + cur.hist.length + ' matches across ' + cur.sessions.length + '. Opening it replaces what is here. '
        : '')
      + 'Loading brings in ' + nd.players.length + ' player' + (nd.players.length === 1 ? '' : 's') + ', ' + nd.hist.length + ' match' + (nd.hist.length === 1 ? '' : 'es') + ' and ' + nd.sessions.length + ' recorded session' + (nd.sessions.length === 1 ? '' : 's') + '.',

function hardReset(){

    'Erase everything',

/* ---------- shortcut keys ---------- */
// Only letters, numbers and three named keys are assignable. Anything with a
// modifier, and every function/navigation key, stays with the browser.
function tok(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return null;
  const k = e.key;
  if(k === ' ' || k === 'Spacebar' || k === 'Space') return 'space';
  if(k === 'Escape' || k === 'Esc') return 'escape';
  if(k === 'Enter') return 'enter';
  if(k && k.length === 1 && /[a-z0-9]/i.test(k)) return k.toLowerCase();
  return null;
}
function keyLabel(t){
  if(t === 'space') return 'Space';
  if(t === 'escape') return 'Esc';
  if(t === 'enter') return 'Enter';
  return /[a-z]/.test(t) ? t.toUpperCase() : t;
}
function binding(d){
  const m = {}, ks = (d && d.keys) || {};
  KEYS.forEach(([id,,def]) => { m[id] = KTOK.test(ks[id] || '') ? ks[id] : def; });
  return m;
}
// token -> action. First entry wins, so a hand-edited file that doubles up
// leaves one action unreachable rather than firing two at once.
function keymap(d){
  const b = binding(d), m = {};
  KEYS.forEach(([id]) => { if(!m[b[id]]) m[b[id]] = id; });
  return m;
}
function bindKey(id, e){
  const t = tok(e);
  if(!t){ setU({kmsg:'That key is reserved by the browser. Use a letter, a number, Space, Enter or Esc.'}); return; }
  const b = binding(D);
  const clash = KEYS.find(([kid]) => kid !== id && b[kid] === t);
  if(clash){ setU({kmsg:keyLabel(t) + ' is already set to “' + clash[1] + '”.'}); return; }
  set(x => { x.keys = Object.assign({}, x.keys); x.keys[id] = t; });
  setU({listen:null, kmsg:''});
}
function resetKeys(){
  set(x => { x.keys = {}; }, 'Shortcuts back to defaults');
  setU({listen:null, kmsg:''});
}

/* ---------- lookups ---------- */
function Pl(d,id){ return d.players.find(p => p.id === id); }
function nm(d,id){ const p = Pl(d,id); return p ? p.name : '-'; }
function tname(d,ids){ return ids.map(i => nm(d,i)).join(' & '); }
function pk(a,b){ return [a,b].sort().join('|'); }
// A finished match stays on its court so the result is still readable, but
// its players are off court from every other point of view: they queue, they
// can be seated again, and the court counts as free for generation.
function isDone(m){ return !!(m && m.done); }
function isLive(m){ return !!(m && !m.done && (m.t1||[]).length && (m.t2||[]).length); }
function liveCourts(d){ return d.courts.filter(c => isLive(c.m)).length; }
function seated(d){ const s = new Set(); d.courts.forEach(c => { if(c.m && !c.m.done){ (c.m.t1||[]).forEach(i => s.add(i)); (c.m.t2||[]).forEach(i => s.add(i)); } }); return s; }
function per(d){ return d.s.fmt === 'doubles' ? 4 : 2; }
function isComp(d){ return COMP.indexOf(d.s.style) >= 0; }
function queue(d){
  const st = seated(d), rest = d.s.o.rest;
  return d.players.filter(p => p.status === 'in' && !st.has(p.id) && !(p.cool > 0))
    .sort((a,b) => (rest ? (a.seat||0)-(b.seat||0) : 0) || a.games-b.games || (a.seat||0)-(b.seat||0) || a.name.localeCompare(b.name));
}
function units(list, d){
  const used = new Set(), out = [];
  for(const p of list){
    if(used.has(p.id)) continue;
    const mid = d.pairs[p.id];
    if(mid){
      const mate = list.find(x => x.id === mid);
      if(mate && !used.has(mate.id)){ used.add(p.id); used.add(mate.id); out.push([p, mate]); }
      else used.add(p.id);
    } else { used.add(p.id); out.push([p]); }
  }
  return out;
}
function take(us, n){
  const idx = []; let c = 0;
  for(let i = 0; i < us.length && c < n; i++){ if(c + us[i].length > n) continue; idx.push(i); c += us[i].length; }
  if(c < n) return null;
  const chosen = idx.map(i => us[i]);
  idx.slice().sort((a,b) => b-a).forEach(i => us.splice(i,1));
  return chosen;
}
function rate(p){ return p.games ? p.wins / p.games : .5; }
function splitTeams(chosen, d){
  const flat = []; chosen.forEach(u => u.forEach(p => flat.push(p)));
  if(flat.length === 2) return {t1:[flat[0]], t2:[flat[1]], tags:mkTags(d, false)};
  const fixed = chosen.filter(u => u.length === 2);
  if(fixed.length >= 2) return {t1:fixed[0], t2:fixed[1], tags:['Locked pairs']};
  if(fixed.length === 1){ const s = chosen.filter(u => u.length === 1).map(u => u[0]); return {t1:fixed[0], t2:s, tags:['Locked pair']}; }
  const combos = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  let best = null, isFresh = true;
  combos.forEach(cb => {
    const A = [flat[cb[0][0]], flat[cb[0][1]]], B = [flat[cb[1][0]], flat[cb[1][1]]];
    let cost = 0, rep = 0;
    if(d.s.o.noPtn) rep += (d.ptn[pk(A[0].id,A[1].id)]||0) + (d.ptn[pk(B[0].id,B[1].id)]||0);
    if(d.s.o.newOpp) A.forEach(a => B.forEach(b => { rep += (d.met[pk(a.id,b.id)]||0); }));
    cost += rep * 10;
    if(d.s.o.skill) cost += Math.abs((rate(A[0])+rate(A[1])) - (rate(B[0])+rate(B[1]))) * 6;
    if(!best || cost < best.cost){ best = {cost, A, B}; isFresh = rep === 0; }
  });

}
function mkTags(d, isFresh){
  const t = [];
  if(d.s.o.rest) t.push('Longest wait');
  if(d.s.o.skill) t.push('Skill matched');
  if(isFresh && (d.s.o.newOpp || d.s.o.noPtn)) t.push('New pairing');
  return t.slice(0,2);
}
function mark(d, m){
  const A = m.t1 || [], B = m.t2 || [];
  if(A.length === 2) d.ptn[pk(A[0],A[1])] = (d.ptn[pk(A[0],A[1])]||0) + 1;
  if(B.length === 2) d.ptn[pk(B[0],B[1])] = (d.ptn[pk(B[0],B[1])]||0) + 1;
  A.forEach(a => B.forEach(b => { d.met[pk(a,b)] = (d.met[pk(a,b)]||0) + 1; }));
}

/* ---------- generation ---------- */
// Generating is never refused. Matches still being played are abandoned, and
// abandoning is destructive enough to be worth one question first -- but only
// when there is genuinely something to lose.
function nextRound(){
  const n = liveCourts(D);
  if(!n) return nextRound_();
  const many = n > 1;
  ask('Discard ' + n + (many ? ' matches' : ' match') + ' in progress?',
    (many ? 'These ' + n + ' matches are' : 'This match is') + ' still being played. '
      + (many ? 'They are' : 'It is') + ' abandoned to make the new round, no result is saved, and nobody’s record changes.',
    'Discard and generate', () => nextRound_());
}
function nextRound_(){
  clearTimeout(T.auto);
  set(d => {
    if(d.swap) d.swap = null;
    d._brkEnd = 0;
    d.courts.forEach(c => {
      const m = c.m; if(!m) return;
      if(m.done){ c.m = null; return; }
      // A King of the Court holder waiting on a challenger is not a match in
      // progress; leaving it seated is what keeps winners-stay working.
      if(!(m.t1||[]).length || !(m.t2||[]).length) return;
      [...(m.t1||[]), ...(m.t2||[])].forEach(id => { const p = Pl(d,id); if(p) p.seat = Date.now(); });
      c.m = null;
    });
    const before = d.courts.filter(c => c.m && c.m.t1.length && c.m.t2.length).length;
    if(isComp(d)){
      if(!d.comp || !d.comp.ents.length) startComp(d);
      seatComp(d);
    }
    else if(d.s.style === 'kotc') genKotc(d);
    else genCasual(d);
    const after = d.courts.filter(c => c.m && c.m.t1.length && c.m.t2.length).length;
    d.round++;
    d._added = after - before;
    d._short = isComp(d) && !d.comp;
    // Generating always resets the clock to a full match, but only starts it
    // when Auto-advance timer is on. With it off the operator starts manually.
    if(d.t.len){
      d.t.left = d.t.len;
      d.t.run = !!d.s.o.auto;
      d.t.end = d.t.run ? Date.now() + d.t.len*1000 : 0;
    }
    if(d.v === 'sess') d.v = 'dash';
    d._invite = !d.t.run;
  });
  const a = D._added;
  setTimeout(() => {
    if(a > 0) toast(a + (a === 1 ? ' court seated' : ' courts seated'), 'ok');
    else if(D._short) toast('Add at least two active players to start ' + ST[D.s.style].n, 'bad');
    else toast('No new matches could be made', 'bad');
  }, 30);
}
function genCasual(d){
  const n = per(d), cfg = d.s.casual;
  if(cfg.rounds && d.round >= cfg.rounds) return;
  let q = queue(d);
  if(cfg.sortBy === 'games') q = [...q].sort((a,b) => a.games-b.games || (a.seat||0)-(b.seat||0));
  if(cfg.sortBy === 'rank') q = [...q].sort((a,b) => rate(b)-rate(a) || a.games-b.games);
  if(cfg.cap) q = q.filter(p => p.games < cfg.cap);
  if(cfg.rest > 1){ const sit = Math.floor(q.length / cfg.rest); if(sit > 0) q = q.slice(0, q.length - sit); }
  const us = units(q, d);
  d.courts.forEach(c => {
    if(c.m) return;
    const g = take(us, n); if(!g) return;
    const t = splitTeams(g, d);
    c.m = {t1:t.t1.map(p => p.id), t2:t.t2.map(p => p.id), st:Date.now(), tags:t.tags};
    mark(d, c.m);
  });
}
function genKotc(d){
  const n = per(d), half = n/2;
  const q = queue(d);
  const pool = d.s.kotc.src === 'random'
    ? [...q].sort(() => Math.random() - .5)
    : [...q].sort((a,b) => a.games - b.games || (a.seat||0) - (b.seat||0));
  const us = units(pool, d);
  d.courts.forEach(c => {
    if(c.m && c.m.t1.length && c.m.t2.length) return;
    if(c.m && c.m.t1.length && !c.m.t2.length){
      if(d.s.kotc.noRematch) us.sort((x,y) => {
        const cost = u => u.reduce((s,p) => s + c.m.t1.reduce((s2,wid) => s2 + (d.met[pk(p.id,wid)]||0), 0), 0);
        return cost(x) - cost(y);
      });
      const g = take(us, half); if(!g) return;
      const pl = []; g.forEach(u => u.forEach(p => pl.push(p)));
      c.m.t2 = pl.map(p => p.id); c.m.st = Date.now(); c.m.tags = ['Challengers'];
      mark(d, c.m); return;
    }
    if(!c.m){
      const g = take(us, n); if(!g) return;
      const t = splitTeams(g, d);
      c.m = {t1:t.t1.map(p => p.id), t2:t.t2.map(p => p.id), st:Date.now(), hold:0, tags:t.tags};
      mark(d, c.m);
    }
  });
}

/* ---------- competitions ---------- */
function buildEntrants(d){
  const ins = d.players.filter(p => p.status === 'in');
  if(d.s.fmt === 'singles') return ins.map(p => ({id:uid(), name:p.name, ids:[p.id]}));
  const list = [...ins], out = [], used = new Set();
  list.forEach(p => {
    if(used.has(p.id)) return;
    const mid = d.pairs[p.id];
    if(mid && !used.has(mid) && list.find(x => x.id === mid)){
      used.add(p.id); used.add(mid);
      out.push({id:uid(), name:p.name + ' & ' + nm(d,mid), ids:[p.id,mid]});
    }
  });
  const rest = list.filter(p => !used.has(p.id));
  const seedBy = (d.s[d.s.style]||{}).seed;
  if(seedBy === 'record') rest.sort((a,b) => rate(b)-rate(a) || b.wins-a.wins);
  else rest.sort(() => Math.random()-.5);
  for(let i = 0; i + 1 < rest.length; i += 2) out.push({id:uid(), name:rest[i].name + ' & ' + rest[i+1].name, ids:[rest[i].id, rest[i+1].id]});

}
function seedOrder(n){ let o = [0]; while(o.length < n){ const m = o.length*2, t = []; o.forEach(v => { t.push(v); t.push(m-1-v); }); o = t; } return o; }
function mkBracket(c, ents, br){
  const size = 1 << Math.ceil(Math.log2(Math.max(2, ents.length)));
  const slots = seedOrder(size).map(i => ents[i] || null);
  for(let i = 0; i < size; i += 2){
    const a = slots[i], b = slots[i+1];
    if(a && b) c.ms.push({id:uid(), br, rd:1, slot:i/2, ea:a.id, eb:b.id, w:null});
    else if(a || b) c.adv[br + ':2:' + Math.floor(i/2/2) + ':' + ((i/2)%2)] = (a||b).id;
  }

function brSize(c, br){ return br === 'main' ? c.mainSize : (c['size_' + br] || c.mainSize); }
function rr(ents){
  const l = [...ents]; if(l.length % 2) l.push(null);

  for(let r = 0; r < n-1; r++){
    const rd = [];
    for(let i = 0; i < n/2; i++){ const a = l[i], b = l[n-1-i]; if(a && b) rd.push([a,b]); }
    l.splice(1, 0, l.pop());

  }

function startComp(d){
  const style = d.s.style, ents = buildEntrants(d);
  // Never leave a competition object behind for a roster that can't fill one.
  if(ents.length < 2){ d.comp = null; return; }
  const c = {style, ents, ms:[], adv:{}, round:1, phase:'main', champ:null, byes:{}, fin:false, mainSize:0, rounds:0};
  d.comp = c;
  if(style === 'tour'){
    const seeded = [...ents];
    if(d.s.tour.seed === 'record') seeded.sort((a,b) => eRate(d,b) - eRate(d,a));
    else seeded.sort(() => Math.random()-.5);

  } else if(style === 'league'){
    const pools = d.s.league.pools === 'two';
    const groups = pools ? [ents.filter((e,i) => i%2===0), ents.filter((e,i) => i%2===1)] : [ents];
    groups.forEach((g,gi) => { g.forEach(e => { e.pool = pools ? (gi===0?'A':'B') : null; }); });
    let rd = 0;
    const passes = d.s.league.rounds === 2 ? 2 : 1;
    for(let pass = 0; pass < passes; pass++){
      const pr = groups.map(g => rr(g));
      const maxR = Math.max(...pr.map(r => r.length));
      for(let r = 0; r < maxR; r++){
        rd++;
        pr.forEach(rounds => (rounds[r]||[]).forEach(pair => {
          const a = pass === 0 ? pair[0] : pair[1], b = pass === 0 ? pair[1] : pair[0];
          c.ms.push({id:uid(), br:'main', rd, slot:c.ms.filter(m => m.rd === rd).length, ea:a.id, eb:b.id, w:null});

function eRate(d, e){ const ps = e.ids.map(i => Pl(d,i)).filter(Boolean); return ps.length ? ps.reduce((s,p) => s + rate(p), 0)/ps.length : .5; }
function standings(d){
  const c = d.comp; if(!c) return [];
  const rows = c.ents.map(e => ({id:e.id, name:e.name, pool:e.pool ? ' · Pool ' + e.pool : '', p:0, w:(c.byes||{})[e.id]||0, l:0}));
  const by = id => rows.find(r => r.id === id);
  c.ms.filter(m => m.br === 'main' && m.w).forEach(m => {
    const a = by(m.ea), b = by(m.eb);
    if(a){ a.p++; if(m.w === a.id) a.w++; else a.l++; }
    if(b){ b.p++; if(m.w === b.id) b.w++; else b.l++; }
  });
  return rows.sort((x,y) => y.w - x.w || x.l - y.l || x.name.localeCompare(y.name));
}
function eName(c, id){ const e = c.ents.find(x => x.id === id); return e ? e.name : '-'; }
function rdLabel(d, m){
  const c = d.comp;
  if(m.br === 'bronze') return '3rd place';
  if(m.br === 'cons') return 'Consolation R' + m.rd;
  if(m.br === 'po') return knockLabel(brSize(c,'po'), m.rd, 'Final');
  if(c.style === 'tour'){
    if(m.rd === 1 && c.ms.filter(x => x.br==='main' && x.rd===1).length < c.mainSize/2) return 'Play-in';
    return knockLabel(c.mainSize, m.rd, 'Final');
  }
  return 'Round ' + m.rd;
}
function knockLabel(size, rd, finalWord){
  const left = size / Math.pow(2, rd - 1);
  if(left <= 2) return finalWord;
  if(left === 4) return 'Semi-final';
  if(left === 8) return 'Quarter-final';
  return 'Round of ' + left;
}
function compWin(d, mid, side){
  const c = d.comp; const m = c.ms.find(x => x.id === mid); if(!m || m.w) return;
  m.w = side === 'a' ? m.ea : m.eb; m.l = side === 'a' ? m.eb : m.ea;
  if(c.style !== 'tour' && m.br === 'main'){ compAdvance(d); return; }
  const size = brSize(c, m.br), left = size / Math.pow(2, m.rd - 1);
  if(m.br === 'main' && c.style === 'tour' && left === 4 && d.s.tour.third){
    c.bronze = c.bronze || []; if(c.bronze.indexOf(m.l) < 0) c.bronze.push(m.l);
  }
  if(left <= 2){
    if(m.br === 'main' || m.br === 'po'){ c.champ = eName(c, m.w); c.phase = 'done'; }
  } else {
    c.adv[m.br + ':' + (m.rd+1) + ':' + Math.floor(m.slot/2) + ':' + (m.slot%2)] = m.w;
  }

}
function compAdvance(d){
  const c = d.comp; if(!c) return;
  const brs = Array.from(new Set(c.ms.map(m => m.br)));
  brs.forEach(br => {
    if(br === 'main' && c.style !== 'tour') return;
    for(let guard = 0; guard < 8; guard++){
      const rds = c.ms.filter(m => m.br === br).map(m => m.rd);
      const rd = rds.length ? Math.max(...rds) : 0;
      if(!rd) break;
      if(c.ms.filter(m => m.br === br && m.rd === rd && !m.w).length) break;
      const size = brSize(c, br);
      if(size / Math.pow(2, rd - 1) <= 2) break;
      const nr = rd + 1, cnt = size / Math.pow(2, nr - 1) / 2;
      let made = 0;
      for(let s = 0; s < Math.max(1, cnt); s++){
        const a = c.adv[br + ':' + nr + ':' + s + ':0'], b = c.adv[br + ':' + nr + ':' + s + ':1'];
        if(a && b){ if(!c.ms.find(m => m.br === br && m.rd === nr && m.slot === s)){ c.ms.push({id:uid(), br, rd:nr, slot:s, ea:a, eb:b, w:null}); made++; } }
        else if(a || b) c.adv[br + ':' + (nr+1) + ':' + Math.floor(s/2) + ':' + (s%2)] = a || b;
      }
      if(made) break;
    }
  });
  if(c.style === 'tour'){
    if(c.bronze && c.bronze.length === 2 && !c.ms.find(m => m.br === 'bronze')){
      c.ms.push({id:uid(), br:'bronze', rd:1, slot:0, ea:c.bronze[0], eb:c.bronze[1], w:null});
      c['size_bronze'] = 2;
    }
    if(d.s.tour.cons && !c.consMade){
      const r1 = c.ms.filter(m => m.br === 'main' && m.rd === 1);
      if(r1.length && !r1.filter(m => !m.w).length){
        const losers = r1.map(m => c.ents.find(e => e.id === m.l)).filter(Boolean);
        if(losers.length >= 2){ mkBracket(c, losers, 'cons'); c.consMade = true; }
      }
    }
    const mainRds = c.ms.filter(m => m.br === 'main');
    c.round = mainRds.length ? Math.max(...mainRds.map(m => m.rd)) : 1;
  } else {
    const pend = c.ms.filter(m => m.br === 'main' && m.rd === c.round && !m.w);
    if(!pend.length){
      const mains = c.ms.filter(m => m.br === 'main');
      const maxRd = mains.length ? Math.max(...mains.map(m => m.rd)) : 0;
      if(c.round < maxRd) c.round++;
      else if(!c.fin && (d.s[c.style].finals || 'off') !== 'off'){
        const n = d.s[c.style].finals === 'top4' ? 4 : 2;
        const top = standings(d).slice(0, n).map(r => c.ents.find(e => e.id === r.id)).filter(Boolean);
        if(top.length >= 2){ mkBracket(c, top, 'po'); c.fin = true; }
        else { c.champ = (standings(d)[0]||{}).name; c.phase = 'done'; }
      } else if(!c.champ && !c.ms.filter(m => !m.w).length){
        c.champ = (standings(d)[0]||{}).name || null; c.phase = 'done';
      }
    }
  }
}
function seatComp(d){
  const c = d.comp; if(!c) return;
  compAdvance(d);
  const busy = new Set(d.courts.filter(x => x.m && x.m.mid).map(x => x.m.mid));
  const pend = c.ms.filter(m => !m.w && !busy.has(m.id) && (m.br !== 'main' || m.rd <= c.round)).sort((a,b) => a.rd - b.rd || a.slot - b.slot);
  d.courts.forEach(court => {
    if(court.m) return;
    const m = pend.shift(); if(!m) return;
    const ea = c.ents.find(e => e.id === m.ea), eb = c.ents.find(e => e.id === m.eb);
    if(!ea || !eb) return;
    court.m = {t1:[...ea.ids], t2:[...eb.ids], st:Date.now(), mid:m.id, lbl:rdLabel(d,m), tags:[rdLabel(d,m)]};
    mark(d, court.m);
  });
}

/* ---------- results ---------- */
function win(cid, side){
  const cfg = D.s[D.s.style];
  const go = () => win_(cid, side);
  if(isComp(D) && cfg && cfg.confirm) ask('Confirm this winner?', 'This locks in the result and advances the bracket or standings.', 'Confirm', go);
  else go();
}
function win_(cid, side){
  set(d => {
    const c = d.courts.find(x => x.id === cid); if(!c || !c.m || c.m.done) return;
    const m = c.m, W = side === 'a' ? m.t1 : m.t2, L = side === 'a' ? m.t2 : m.t1;
    if(!W.length || !L.length) return;
    const dur = Math.max(1, Math.round((Date.now() - (m.st || Date.now()))/1000));
    d.players.forEach(p => { if(p.cool > 0) p.cool--; });
    W.forEach(id => { const p = Pl(d,id); if(p){ p.games++; p.wins++; p.streak = p.streak > 0 ? p.streak+1 : 1; p.best = Math.max(p.best||0, p.streak); } });
    L.forEach(id => { const p = Pl(d,id); if(p){ p.games++; p.losses++; p.streak = p.streak < 0 ? p.streak-1 : -1; p.seat = Date.now(); } });
    d.gn++;
    const hid = uid();
    d.hist.unshift({id:hid, n:d.gn, w:W.map(i => nm(d,i)), l:L.map(i => nm(d,i)), wi:[...W], li:[...L], style:d.s.style, fmt:d.s.fmt, lbl:m.lbl || ('Court ' + (d.courts.indexOf(c)+1)), dur, ts:Date.now(), comp:!!m.mid});
    if(d.hist.length > 4000) d.hist.length = 4000;
    if(m.mid && d.comp) compWin(d, m.mid, side);
    // The court holds the finished match instead of emptying, so whoever is
    // watching can still read who won while the next round is being made.
    const finish = () => { c.m = Object.assign({}, m, {done:true, win:side, endedAt:Date.now(), hid}); };
    if(d.s.style === 'kotc' && !m.mid){
      const hold = (m.hold||0) + 1, cap = d.s.kotc.cap;
      if(cap && hold >= cap){
        W.forEach(id => { const p = Pl(d,id); if(p){ p.cool = d.s.kotc.cool || 0; p.seat = Date.now(); } });
        finish();
      } else c.m = {t1:[...W], t2:[], st:Date.now(), hold, tags:['Winners stay ×' + hold]};
    } else {
      W.forEach(id => { const p = Pl(d,id); if(p) p.seat = Date.now(); });
      finish();
    }
  }, 'Result saved · tap Undo in History to fix');
}
// Same correction as History's Swap winner, triggered from a finished court
// card instead; competition matches stay locked to the bracket either way.
function courtSwap(hid){
  const h = D.hist.find(x => x.id === hid); if(!h) return;
  if(h.comp) toast('Competition results follow the bracket. Reset the round instead.', 'bad');
  else hswap(hid);
}
function hswap(hid){
  const go = () => set(d => {
    const h = d.hist.find(x => x.id === hid); if(!h) return;
    if(h.comp){ h.locked = true; return; }
    h.wi.forEach(id => { const p = Pl(d,id); if(p){ p.wins = Math.max(0, p.wins-1); p.losses++; } });
    h.li.forEach(id => { const p = Pl(d,id); if(p){ p.wins++; p.losses = Math.max(0, p.losses-1); } });
    const w = h.w, wi = h.wi; h.w = h.l; h.wi = h.li; h.l = w; h.li = wi;
    restreak(d, [...h.wi, ...h.li]);
    d.courts.forEach(c => { if(c.m && c.m.hid === hid) c.m.win = c.m.win === 'a' ? 'b' : 'a'; });
  }, 'Winner corrected');
  if(D.s.o.lockScores) ask('Swap the winner?', 'Win/loss counts for both sides are flipped for this match.', 'Swap', go);
  else go();
}
// Correcting a result changes who was on a run, so both sides' current and
// longest streaks are rebuilt from the match list in the order it was played.
function restreak(d, ids){
  const asc = [...d.hist].sort((a,b) => (a.ts||0) - (b.ts||0) || (a.n||0) - (b.n||0));
  Array.from(new Set(ids)).forEach(id => {
    const p = Pl(d, id); if(!p) return;
    let cur = 0, best = 0, seen = false;
    asc.forEach(h => {
      const won = (h.wi||[]).indexOf(id) >= 0, lost = (h.li||[]).indexOf(id) >= 0;
      if(!won && !lost) return;
      seen = true;
      cur = won ? (cur > 0 ? cur + 1 : 1) : (cur < 0 ? cur - 1 : -1);
      if(cur > best) best = cur;
    });
    if(seen){ p.streak = cur; p.best = best; }
  });
}

/* ---------- subs ---------- */
function swapToggle(){ set(d => { d.swap = d.swap ? null : {pick:null}; }); }
function swapPick(pid){
  let did = false;
  set(d => {
    if(!d.swap) return;
    if(!d.swap.pick){ d.swap.pick = pid; return; }
    if(d.swap.pick === pid){ d.swap.pick = null; return; }
    const A = d.swap.pick, B = pid; d.swap.pick = null;
    const loc = id => { for(const c of d.courts){ if(!c.m || c.m.done) continue; for(const t of ['t1','t2']){ const i = (c.m[t]||[]).indexOf(id); if(i >= 0) return {c,t,i}; } } return null; };
    const la = loc(A), lb = loc(B);
    if(la && lb){ la.c.m[la.t][la.i] = B; lb.c.m[lb.t][lb.i] = A; }
    else if(la) la.c.m[la.t][la.i] = B;
    else if(lb) lb.c.m[lb.t][lb.i] = A;
    else return;
    did = true;
    if(d.comp) d.courts.forEach(c => {
      if(!c.m || !c.m.mid) return;
      const m = d.comp.ms.find(x => x.id === c.m.mid); if(!m) return;
      const ea = d.comp.ents.find(e => e.id === m.ea), eb = d.comp.ents.find(e => e.id === m.eb);
      if(ea){ ea.ids = [...c.m.t1]; ea.name = tname(d, ea.ids); }
      if(eb){ eb.ids = [...c.m.t2]; eb.name = tname(d, eb.ids); }
    });
  });
  if(did) toast('Subbed');
}

/* ---------- roster ---------- */
function addPlayer(){
  const raw = U.nameIn.trim(); if(!raw) return;
  const names = raw.split(',').map(s => s.trim()).filter(Boolean);
  U.nameIn = '';
  if(!names.length){ render(); return; }
  // Count what actually lands, so a paste full of names already on the roster
  // cannot report them as added.
  const have = new Set(D.players.map(p => p.name.toLowerCase()));
  const add = [];
  names.forEach(n => { n = n.slice(0, 40); const k = n.toLowerCase(); if(have.has(k)) return; have.add(k); add.push(n); });
  const room = Math.max(0, 400 - D.players.length);
  const fits = add.slice(0, room);
  const skipped = names.length - add.length;
  const msg = fits.length
    ? fits.length + (fits.length === 1 ? ' player added' : ' players added') + (skipped ? ' · ' + skipped + ' already on the roster' : '')
    : (add.length ? 'The roster is full at 400 players' : (skipped === 1 ? 'That name is already on the roster' : 'Those names are already on the roster'));
  set(d => fits.forEach(n => {
    d.players.push({id:uid(), name:n, status:'in', games:0, wins:0, losses:0, streak:0, best:0, seat:Date.now(), cool:0});
  }), msg, fits.length ? 'ok' : 'bad');
}
function togglePlayer(id){
  set(d => { const p = Pl(d,id); if(p) p.status = p.status === 'in' ? 'away' : 'in'; });
}
function removePlayers(ids){
  let wo = 0;
  set(d => {
    ids.forEach(id => {
      d.players = d.players.filter(p => p.id !== id);
      const mate = d.pairs[id]; if(mate){ delete d.pairs[mate]; delete d.pairs[id]; }
      d.courts.forEach(c => { if(c.m){ c.m.t1 = c.m.t1.filter(x => x !== id); c.m.t2 = (c.m.t2||[]).filter(x => x !== id); if(!c.m.t1.length) c.m = null; } });
    });
    if(d.comp) wo = purgeComp(d, ids);
  }, ids.length + (ids.length === 1 ? ' player removed' : ' players removed'));
  setU({sel:[]});
  if(wo) setTimeout(() => toast(wo + (wo === 1 ? ' match given as a walkover' : ' matches given as walkovers'), 'ok'), 60);
}
// A player leaving mid-competition used to leave a ghost entrant that could
// still win fixtures. Drop them, award their pending matches as walkovers.
function purgeComp(d, ids){
  const c = d.comp, gone = new Set(ids), dead = new Set();
  c.ents.forEach(e => {
    e.ids = (e.ids || []).filter(i => !gone.has(i));
    if(!e.ids.length) dead.add(e.id); else e.name = tname(d, e.ids);
  });
  if(!dead.size) return 0;
  c.ents = c.ents.filter(e => !dead.has(e.id));
  let wo = 0;
  c.ms.forEach(m => {
    if(m.w) return;
    const da = dead.has(m.ea), db = dead.has(m.eb);
    if(da && db) m.void = true;
    else if(da || db){ m.w = da ? m.eb : m.ea; m.l = da ? m.ea : m.eb; m.wo = true; wo++; }
  });
  c.ms = c.ms.filter(m => !m.void);
  Object.keys(c.adv).forEach(k => { if(dead.has(c.adv[k])) delete c.adv[k]; });
  d.courts.forEach(x => { if(x.m && x.m.mid && !c.ms.find(m => m.id === x.m.mid && !m.w)) x.m = null; });
  if(c.ents.length < 2){ c.phase = 'done'; c.champ = c.ents.length ? c.ents[0].name : null; }
  else compAdvance(d);
  return wo;
}
function pair(a, b){
  if(a === b || !Pl(D,a) || !Pl(D,b)) return;
  set(d => {
    [a,b].forEach(x => { const m = d.pairs[x]; if(m){ delete d.pairs[m]; delete d.pairs[x]; } });
    d.pairs[a] = b; d.pairs[b] = a;
  }, 'Locked as a doubles team');
}
function unpair(a){ set(d => { const m = d.pairs[a]; if(m) delete d.pairs[m]; delete d.pairs[a]; }, 'Pair split'); }

/* ---------- settings ---------- */
function setS(fn, msg){ set(d => fn(d.s, d), msg); }
function setCourts(n){
  n = Math.max(1, Math.min(12, n));
  // Only a match still being played is worth warning about.
  const drop = n < D.courts.length && D.courts.slice(n).some(c => isLive(c.m));
  const go = () => set(d => {
    d.s.courts = n;
    while(d.courts.length < n) d.courts.push({id:uid(), m:null});
    while(d.courts.length > n) d.courts.pop();
  });
  if(drop && D.s.o.courtWarn) ask('Reduce to ' + n + ' court' + (n > 1 ? 's' : '') + '?', 'Matches in progress on the removed courts go back to the queue unfinished.', 'Reduce', go);
  else go();
}
function setBrk(n){ set(d => { d.s.brk = Math.max(0, Math.min(15, Math.round(n*2)/2)); }); }
// Breaks step by 30s, so a bare "1.5m" would read oddly.
function fmtBrk(m){ if(!m) return '0m'; const s = Math.round(m*60), mm = Math.floor(s/60), ss = s%60; return mm ? (ss ? mm+'m '+ss+'s' : mm+'m') : ss+'s'; }
function setLen(n){ set(d => { n = Math.max(1, Math.min(60, n)); d.s.len = n; d.t.len = n*60; if(!d.t.run) d.t.left = n*60; }); }
function pickStyle(k){
  if(k === D.s.style) return;
  const go = () => set(d => { d.s.style = k; d.comp = null; d.round = 0; d.courts.forEach(c => { c.m = null; }); });
  if(D.comp && D.comp.phase !== 'done') ask('Switch play style?', 'The current ' + ST[D.s.style].n + ' competition and all its matches will be deleted. The courts are cleared.', 'Switch', go);
  else go();
}
function timerToggle(){
  unlockAudio();
  set(d => {
    d._invite = false;
    if(d.t.run){ d.t.run = false; d.t.left = Math.max(0, Math.round((d.t.end - Date.now())/1000)); }
    else { if(d.t.left <= 0) d.t.left = d.t.len; d.t.run = true; d.t.end = Date.now() + d.t.left*1000; }
  });
}
function clearCourts(){
  const comp = isComp(D);
  ask(comp ? 'Reset competition?' : 'Clear all courts?',
    comp ? 'All matches, standings and the draw for this competition are deleted. Player stats and history are kept.' : 'Every court is emptied and those players go back to the queue. No results are recorded.',
    comp ? 'Reset' : 'Clear',
    () => set(d => { d.courts.forEach(c => { c.m = null; }); if(comp){ d.comp = null; d.round = 0; } }, comp ? 'Competition reset' : 'Courts cleared'));
}

/* ---------- scoreboard ---------- */
const SB = {
  add: k => set(x => { x.sb[k]++; x.sb.h.push(k); }),
  // Each side's Undo takes a point back off that side only.
  undoSide: k => set(x => { const i = x.sb.h.lastIndexOf(k); if(i >= 0) x.sb.h.splice(i,1); x.sb[k] = Math.max(0, x.sb[k] - 1); }),
  undo: () => set(x => { const k = x.sb.h.pop(); if(k) x.sb[k] = Math.max(0, x.sb[k] - 1); }),
  reset: () => set(x => { x.sb.a = 0; x.sb.b = 0; x.sb.h = []; }, 'Scoreboard reset'),
  swap: () => set(x => { const a = x.sb.a, na = x.sb.na; x.sb.a = x.sb.b; x.sb.na = x.sb.nb; x.sb.b = a; x.sb.nb = na; x.sb.h = x.sb.h.map(k => k === 'a' ? 'b' : 'a'); }, 'Sides swapped')
};

const RANKC = ['#ffd24a','#c7d2da','#d8915a'];
const rankCol = i => RANKC[i] || 'var(--mt2)';
const ACCENT_NAMES = {'#4a0d67':'Albany purple','#1e3a8a':'Navy','#0f5132':'Green','#7c2d12':'Brown'};

function vPhoneNav(){
