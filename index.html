/* ---------- dashboard ---------- */
function roundNo(d){ return d.comp ? ('Round ' + d.comp.round + ' of ' + (d.comp.rounds || '?')) : (d.round ? 'Round ' + d.round : 'Not started'); }
function vClock(){
  const t = D.t, zero = t.left === 0;
  const lbl = t.run ? 'Running' : (zero ? 'Time' : 'Paused');
  const col = zero ? 'var(--rd)' : (t.run ? 'var(--acl)' : 'var(--ink)');
  const cls = zero ? ' zero' : (t.run && t.left <= 60 ? ' amber' : '');
  const pulse = D._invite && !t.run;
  return '<div class="clock' + cls + '" id="st-clock">'
    + '<div class="eb">Match clock · ' + lbl + '</div>'
    + '<div class="row"><div class="dw"><div class="dg" style="color:' + col + '">' + ms(t.left) + '</div></div>'
    + '<div class="cbt">'
    + '<button type="button" class="btn p' + (pulse ? ' pulse' : '') + '" data-c="tPlay">' + (t.run ? 'Pause' : 'Start') + '</button>'
    + '<button type="button" class="btn" data-c="tReset">Reset</button>'
    + '<button type="button" class="btn" data-c="tPlus">+1m</button>'
    + '<button type="button" class="btn" data-c="tMinus">−1m</button>'
    + '</div></div></div>';
}
function vRound(){
  const d = D, s = d.s, st = s.style, comp = isComp(d);
  const n = per(d), enough = d.players.filter(p => p.status === 'in').length >= n;
  const genLabel = comp && !d.comp ? 'Start ' + ST[st].n : 'Generate next round';
  return '<div class="card col rc">'
    + '<div class="ch"><h2>Round control</h2><span class="eb">' + roundNo(d) + '</span></div>'
    + '<div class="cb">'
    + '<div><div class="sn">' + ST[st].n + '</div><div class="sd">' + (s.fmt === 'doubles' ? 'Doubles' : 'Singles') + ' · '
    + plural(d.courts.length, ' court', ' courts') + ' · ' + ST[st].d + '</div></div>'
    + '<button type="button" class="gen" data-c="gen"' + (enough ? '' : ' disabled title="Add at least ' + n + ' players on the Session tab first"') + '>' + genLabel + '</button>'
    + '<div class="rgrid">'
    + '<button type="button" class="btn' + (d.swap ? ' on' : '') + '" data-c="subTog" aria-pressed="' + !!d.swap + '">' + (d.swap ? 'Sub mode: on' : 'Sub players') + '</button>'
    + '<button type="button" class="btn" data-c="go" data-a="score">Open scoreboard</button>'
    + '<button type="button" class="btn" data-c="go" data-a="hist">Undo a result</button>'
    + '<button type="button" class="btn d" data-c="clear">' + (comp ? 'Reset competition' : 'Clear all courts') + '</button>'
    + '</div></div></div>';
}
function vCourts(){
  const d = D, swap = !!d.swap, pick = d.swap && d.swap.pick;
  const enough = d.players.filter(p => p.status === 'in').length >= per(d);
  const onBreak = (d._brkEnd || 0) > Date.now();
  const lab = d.s.fmt === 'doubles' ? ['Team A','Team B'] : ['Player A','Player B'];
  const cards = d.courts.map((c, i) => {
    const m = c.m, done = isDone(m);
    const live = !!(m && !done && m.t1.length && (m.t2||[]).length);
    const half = !!(m && !done && m.t1.length && !(m.t2||[]).length);
    const brk = done && onBreak;
    const st = done ? (brk ? 'Break' : 'Final') : (live ? 'Live' : (half ? 'Needs challengers' : 'Open'));
    const sc = done ? (brk ? 'var(--am)' : 'var(--mt2)') : (live ? 'var(--tl)' : (half ? 'var(--am)' : 'var(--mt2)'));
    const can = !swap && live;
    const side = (ids, label, s) => {
      const opa = done ? (m.win === s ? '.82' : '.38') : '1';
      const names = (ids || []).map(id => '<div class="pn' + (pick === id ? ' pick' : '') + '"'
        + (swap && !done ? ' data-c="subPick" data-a="' + id + '" role="button" tabindex="0"' : '') + '>' + esc(nm(d,id)) + '</div>').join('');
      return '<div class="side ' + s + (can ? ' live' : '') + '"'
        + (can ? ' role="button" tabindex="0" data-c="win" data-a="' + c.id + '" data-v="' + s + '" aria-label="Record win for ' + label + '"' : '')
        + ' style="opacity:' + opa + '">'
        + '<div class="sl">' + label + '</div>' + names
        + (s === 'b' && half ? '<div class="waitc">Waiting for challengers</div>' : '')
        + (can ? '<div class="tapw"><i></i>Tap to win</div>' : '')
        + (done ? '<div class="res" style="color:' + (m.win === s ? 'var(--tl)' : 'var(--mt2)') + '">' + (m.win === s ? 'Won' : 'Lost') + '</div>' : '')
        + '</div>';
    };
    const tags = (m && m.tags) || [];
    const showTag = tags.length > 0 && live;
    const body = m
      ? '<div class="cbody">' + side(m.t1, lab[0], 'a') + '<div class="divd"></div>' + side(m.t2 || [], lab[1], 'b') + '</div>'
        + (brk ? '<div class="cfoot brk"><i></i>Break in progress · next round coming</div>' : '')
        + (showTag ? '<div class="cfoot">' + tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '')
      : '<div class="copen"><b>Court open</b><span>' + (isComp(d) ? 'Next fixture seats on Generate' : (enough ? 'Generate a round to fill it' : 'Add players on the Session tab first')) + '</span></div>';
    return '<div class="court' + (half ? ' half' : '') + '" data-key="' + esc(c.id) + '-' + d.round + '" style="animation-delay:' + (i * 45) + 'ms">'
      + '<div class="ctop"><span class="cno">Court <b>' + (i+1) + '</b></span><span class="cst"><span style="color:' + sc + '">' + st + '</span>'
      + (done && m.hid ? '<button type="button" class="swapc" data-c="courtSwap" data-a="' + esc(m.hid) + '" title="Swap winner" aria-label="Swap the winner for this match">' + SWAPSVG + '</button>' : '')
      + '</span></div>' + body + '</div>';
  });
  return '<div class="courts bal grow' + (swap ? ' subon' : '') + '" data-bal="286" data-k="courts">' + cards.join('') + '</div>';
}
function vQueue(){
  const d = D, q = queue(d), swap = !!d.swap, pick = d.swap && d.swap.pick, comp = isComp(d);
  const open = d.courts.filter(c => !c.m).length, need = open * per(d);
  const seatedIds = seated(d);
  // Away players who aren't seated belong in the queue view too (faded), so
  // the operator can undo a removal without leaving the Dashboard.
  const away = d.players.filter(p => p.status === 'away' && !seatedIds.has(p.id) && !(p.cool > 0)).sort((a,b) => a.name.localeCompare(b.name));
  const activeIdx = new Map(q.map((p,i) => [p.id, i]));
  const list = [...q, ...away];
  const canPair = d.s.fmt === 'doubles' && !swap;
  const chip = (p, part) => {
    const idx = activeIdx.get(p.id), active = idx !== undefined;
    const cls = ['qc'];
    if(part) cls.push(part);
    if(!active) cls.push('away');
    else if(pick === p.id) cls.push('pick');
    else if(!part && idx < need) cls.push('next');
    const act = swap ? (active ? 'subPick' : '') : 'toggle';
    return '<button type="button" class="' + cls.join(' ') + '"' + (act ? ' data-c="' + act + '" data-a="' + p.id + '"' : ' disabled')
      + (canPair ? ' draggable="true" data-drag="' + p.id + '"' : '')
      + ' title="' + (swap ? 'Tap to sub in' : (active ? 'Tap to set away' : 'Tap to bring back in')) + '">'
      + '<span class="pos">' + (active ? idx + 1 : '—') + '</span><span class="nm">' + esc(p.name) + '</span>'
      + (part ? '' : '<span class="g">' + p.games + ' g</span>') + '</button>';
  };
  const seen = new Set(), groups = [];
  list.forEach(p => {
    if(seen.has(p.id)) return;
    const mid = d.pairs[p.id], mate = mid ? list.find(x => x.id === mid) : null;
    if(mate && !seen.has(mate.id)){
      seen.add(p.id); seen.add(mate.id);
      groups.push('<div class="grp" data-key="q' + p.id + '">' + chip(p, 'pa')
        + '<button type="button" class="unp" data-c="unpair" data-a="' + p.id + '" title="Unpair" aria-label="Unpair this doubles team"><span>⇆</span></button>'
        + chip(mate, 'pb') + '</div>');
    } else { seen.add(p.id); groups.push('<div class="grp" data-key="q' + p.id + '">' + chip(p) + '</div>'); }
  });
  const empty = q.length === 0 && away.length === 0;
  return '<div class="card col">'
    + '<div class="ch"><h2>' + (comp ? 'Off court' : 'Queue') + '</h2><span class="cnt">' + q.length + '</span></div>'
    + '<div class="cb"><div class="chips">' + groups.join('')
    + (empty ? '<div class="qempty">Nobody waiting. Add players on the Session tab.</div>' : '') + '</div></div></div>';
}
function vStandings(){
  const rows = standings(D);
  return '<div class="card col" style="overflow:hidden">'
    + '<div class="ch"><h2>Standings</h2><span class="eb">' + ST[D.s.style].n + '</span></div>'
    + '<div class="scroll-x"><table class="tbl"><thead><tr><th style="width:34px">#</th><th class="l">Team</th><th>P</th><th>W</th><th>L</th></tr></thead><tbody>'
    + rows.map((r,i) => '<tr><td class="rk" style="color:' + rankCol(i) + '">' + (i+1) + '</td><td class="nm">' + esc(r.name) + '<span>' + esc(r.pool) + '</span></td>'
      + '<td>' + r.p + '</td><td class="w">' + r.w + '</td><td class="lo">' + r.l + '</td></tr>').join('')
    + '</tbody></table></div></div>';
}
function vBracket(){
  const d = D, c = d.comp; if(!c) return '';
  const brs = ['main','bronze','cons','po'].filter(b => c.ms.some(m => m.br === b) && !(b === 'main' && c.style !== 'tour'));
  const cols = [];
  brs.forEach(br => {
    const rds = Array.from(new Set(c.ms.filter(m => m.br === br).map(m => m.rd))).sort((a,b) => a-b);
    rds.forEach(rd => {
      const mss = c.ms.filter(m => m.br === br && m.rd === rd).sort((a,b) => a.slot - b.slot);
      const prefix = br === 'cons' ? 'Consolation · ' : br === 'po' ? 'Playoff · ' : '';
      const title = br === 'bronze' ? '3rd place' : prefix + rdLabel(d, mss[0]);
      cols.push('<div class="bcol"><h3>' + esc(title) + '</h3><div class="bms">' + mss.map(m => {
        const ac = m.w === m.ea ? 'var(--tl)' : (m.w ? 'var(--mt2)' : 'var(--ink)');
        const bc = m.w === m.eb ? 'var(--tl)' : (m.w ? 'var(--mt2)' : 'var(--ink)');
        return '<div class="bm' + (m.w ? '' : ' open') + '">'
          + '<div style="color:' + ac + '">' + esc(eName(c, m.ea)) + '<span>' + (m.w === m.ea ? 'Won' : '') + '</span></div>'
          + '<div style="color:' + bc + '">' + esc(eName(c, m.eb)) + '<span>' + (m.w === m.eb ? 'Won' : '') + '</span></div></div>';
      }).join('') + '</div></div>');
    });
  });
  if(!cols.length) return '';
  return '<div class="card">'
    + '<div class="ch"><h2>Bracket</h2><span class="eb">Byes skip straight through</span></div>'
    + '<div class="cb"><div class="brk-row">' + cols.join('') + '</div></div></div>';
}
function vDash(){
  const d = D, s = d.s, st = s.style, comp = isComp(d);
  const n = per(d), enough = d.players.filter(p => p.status === 'in').length >= n;
  const stand = comp && d.comp && st === 'league';
  const bracket = comp && d.comp && (st === 'tour' || d.comp.fin);
  let h = '<div class="vh"><h1>Courts</h1><p>Tap the winning side of a court to record the result. ' + roundNo(d) + ' · ' + ST[st].n + '.</p></div>';
  if(d.comp && d.comp.champ){
    h += '<div class="champ"><div class="first">1st</div><div><div class="cl">' + ST[st].n + ' champion</div><div class="cn">' + esc(d.comp.champ) + '</div></div>'
      + '<button type="button" class="btn" data-c="newComp">New competition</button></div>';
  }
  if(!enough){
    h += '<div class="alert"><span class="bang" aria-hidden="true">!</span><span class="at">No players added yet</span>'
      + '<span class="ab">You need ' + n + ' in for one ' + (s.fmt === 'doubles' ? 'doubles' : 'singles') + ' court. Add names on the Session tab, then come back and generate.</span>'
      + '<button type="button" class="btn" data-c="go" data-a="sess">Add players</button></div>';
  }
  h += '<div class="two">' + vClock() + vRound() + '</div>';
  if(d.swap){
    h += '<div class="subbar"><span>Sub mode is on, so scoring is paused. Tap a player on court, then tap who takes their place.</span>'
      + '<button type="button" data-c="subTog">Done</button></div>';
  }
  h += vCourts();
  h += '<div class="low">' + vQueue() + (stand ? vStandings() : '') + '</div>';
  if(bracket) h += vBracket();
  return h;
}

/* ---------- session: shared controls ---------- */
function stepper(c, val, label, lock){
  return '<div class="step' + (lock ? ' lock' : '') + '"><button type="button" data-c="' + c + '" data-v="-1" aria-label="Less ' + label + '"' + (lock ? ' aria-disabled="true"' : '') + '>−</button>'
    + '<b>' + val + '</b><button type="button" data-c="' + c + '" data-v="1" aria-label="More ' + label + '"' + (lock ? ' aria-disabled="true"' : '') + '>+</button></div>';
}
function seg(c, cur, opts, lock, cls){
  return '<div class="seg' + (cls ? ' ' + cls : '') + (lock ? ' lock' : '') + '">' + opts.map(o => '<button type="button" data-c="' + c + '" data-a="' + o.v + '"'
    + ' aria-pressed="' + (cur === o.v) + '"' + (lock ? ' aria-disabled="true"' : '') + '>' + o.l + '</button>').join('') + '</div>';
}
function sw(c, a, on, label, lock){
  return '<button type="button" class="sw' + (lock ? ' lock' : '') + '" role="switch" aria-checked="' + !!on + '" aria-label="' + label + '" data-c="' + c + '" data-a="' + a + '"'
    + (lock ? ' aria-disabled="true"' : '') + '><span>' + (on ? 'On' : 'Off') + '</span><span class="tog"></span></button>';
}
// Every game setting is the same row: name and note on the left, control on
// the right in a fixed-width column, so control edges line up down a panel.
function field(label, control, note){
  return '<div class="gr"><div><b>' + label + '</b><div class="note">' + note + '</div></div>' + control + '</div>';
}
function gpanel(title, aside, rows){

function styleRows(d){
  const s = d.s, st = s.style, locked = !!(d.comp && d.comp.phase !== 'done');

  const sg = (k, label, cur, opts, note, lock) => field(label, seg('sSeg', cur, opts, lock).replace(/data-c="sSeg"/g, 'data-c="sSeg" data-k="' + k + '"'), note);
  const tg = (k, label, on, note, lock) => field(label, sw('sTog', k, on, label, lock), note);

    sg('casual.sortBy', 'Queue priority', s.casual.sortBy, [{l:'Wait time',v:'wait'},{l:'Fewest',v:'games'}], 'Longest wait, or fewest games played')

    step('kotc.cool', 'Cooldown', s.kotc.cool, !s.kotc.cap ? 'Set a win cap first' : (s.kotc.cool ? 'Sits out ' + s.kotc.cool + ' matches after the cap' : 'Straight back in the queue'), !s.kotc.cap),
    sg('kotc.src', 'Challengers', s.kotc.src, [{l:'Fewest',v:'fewest'},{l:'Random',v:'random'}], 'Fewest games played, or picked at random'),
    tg('kotc.noRematch', 'Avoid immediate rematch', s.kotc.noRematch, 'Skip challengers who just lost this court')
  ];
  if(st === 'tour') return [
    sg('tour.seed', 'Seeding', s.tour.seed, [{l:'Random',v:'random'},{l:'By record',v:'record'}], locked ? 'Locked while the bracket runs' : 'Sets the first round', locked),
    tg('tour.third', 'Third place', s.tour.third, 'Semi-final losers play off for 3rd', locked),
    tg('tour.cons', 'Consolation', s.tour.cons, 'First-round losers get a second bracket', locked),

    sg('league.pools', 'Pools', s.league.pools, [{l:'One',v:'one'},{l:'Two',v:'two'}], 'Split the field into groups', locked),
    sg('league.finals', 'Finals', s.league.finals, [{l:'Off',v:'off'},{l:'Top 2',v:'top2'},{l:'Top 4',v:'top4'}], 'Playoff after the fixtures', locked),
    tg('league.confirm', 'Confirm winner', s.league.confirm, 'Ask before locking in a result and updating standings')
  ];
}
const CARD_D = {casual:'Fair rotation', kotc:'Winners stay', tour:'Knockout draw', league:'Round robin'};
function sessList(d){
  let list = [...d.players];
  const f = U.fq.p.toLowerCase();
  if(f) list = list.filter(p => p.name.toLowerCase().indexOf(f) >= 0);
  const so = U.fs2.p;
  if(so === 'az') list.sort((a,b) => a.name.localeCompare(b.name));
  else if(so === 'za') list.sort((a,b) => b.name.localeCompare(a.name));
  else if(so === 'games') list.sort((a,b) => b.games - a.games || a.name.localeCompare(b.name));
  else if(so === 'wins') list.sort((a,b) => b.wins - a.wins || a.name.localeCompare(b.name));

function vPlayers(){
  const d = D, selMode = U.selMode, sel = U.sel;

  const chip = (p, part) => {
    const isSel = selMode && sel.indexOf(p.id) >= 0;

/* ---------- stats ---------- */
function vStats(){
  const d = D;
  let rows = d.players.map(p => ({id:p.id, name:p.name, p:p.games, w:p.wins, l:p.losses, pctN:p.games ? p.wins/p.games : 0, st:p.streak || 0, best:p.best || 0}));
  const f = U.fq.s.toLowerCase();
  if(f) rows = rows.filter(r => r.name.toLowerCase().indexOf(f) >= 0);
  const so = U.fs2.s;
  if(so === 'pct') rows.sort((a,b) => b.pctN - a.pctN || b.w - a.w);
  else if(so === 'games') rows.sort((a,b) => b.p - a.p);
  else if(so === 'streak') rows.sort((a,b) => b.st - a.st);
  else if(so === 'az') rows.sort((a,b) => a.name.localeCompare(b.name));
  else rows.sort((a,b) => b.w - a.w || b.pctN - a.pctN);
  const all = d.players;
  const active = all.slice().sort((a,b) => b.games - a.games)[0];
  const best = all.filter(p => p.games >= 1).sort((a,b) => (b.wins/b.games) - (a.wins/a.games))[0];
  const strk = all.slice().sort((a,b) => (b.best||0) - (a.best||0))[0];
  const cards = [
    [d.hist.length, 'Matches played', d.gn ? 'Game ' + d.gn + ' most recent' : 'Nothing yet'],
    [active ? active.games : 0, 'Most active', active ? active.name : '-'],
    [best && best.games ? Math.round(best.wins/best.games*100) + '%' : '0%', 'Top win rate', best ? best.name : '-'],
    [strk ? (strk.best || 0) : 0, 'Longest streak', strk ? strk.name : '-']
  ];
  const wide = U.w >= 720;
  return '<div class="vh"><h1>Stats</h1><p>Every recorded result feeds this leaderboard automatically.</p>'
    + '<button type="button" class="btn s d" data-c="statsReset">Reset all stats</button></div>'
    + '<div class="bal" data-bal="190|4,2,1">' + cards.map(c => '<div class="sum"><b>' + c[0] + '</b><div class="k">' + c[1] + '</div><div class="s">' + esc(c[2]) + '</div></div>').join('') + '</div>'
    + '<div class="card col grow" style="overflow:hidden"><div class="ch lbh"><h2>Leaderboard</h2>'
    + '<input type="search" class="fld" aria-label="Search the leaderboard" placeholder="Search players" value="' + esc(U.fq.s) + '" data-i="fq" data-a="s">'
    + '<select class="fld" aria-label="Sort the leaderboard" data-i="fs2" data-a="s" data-value="' + so + '">'
    + options(so, [['wins','Most wins'],['pct','Win rate'],['games','Most games'],['streak','Streak'],['az','A to Z']]) + '</select></div>'
    + (rows.length ? '<div class="scroll-x"><table class="tbl" style="min-width:min(100%,560px)"><thead><tr><th style="width:38px">#</th><th class="l">Player</th><th>Played</th><th>Won</th><th>Lost</th><th>Win %</th>'
      + (wide ? '<th>Streak</th><th>Best</th>' : '') + '</tr></thead><tbody>'
      + rows.map((r,i) => {
        const stt = r.st > 0 ? 'W' + r.st : r.st < 0 ? 'L' + Math.abs(r.st) : '-';
        const stc = r.st > 0 ? 'color:var(--tl);background:color-mix(in srgb,var(--tl) 12%,transparent)' : r.st < 0 ? 'color:var(--rd);background:rgba(255,111,97,.12)' : 'color:var(--mt2)';
        return '<tr data-key="r' + r.id + '"><td class="rk" style="color:' + rankCol(i) + '">' + (i+1) + '</td><td class="nm">' + esc(r.name) + '</td>'
          + '<td>' + r.p + '</td><td class="w">' + r.w + '</td><td class="lo">' + r.l + '</td><td>' + (r.p ? Math.round(r.pctN*100) + '%' : '-') + '</td>'
          + (wide ? '<td><span class="strk" style="' + stc + '">' + stt + '</span></td><td class="lo">' + r.best + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="empty"><b>No records yet</b>Play a round and results will land here.</div>')
    + '</div>';
}

/* ---------- history ---------- */
function av(name){
  const n = String(name || '?'); let h = 0;
  for(let i = 0; i < n.length; i++) h = (h*31 + n.charCodeAt(i)) % 360;
  const ini = n.trim().split(/\s+/).map(w => w[0] || '').slice(0,2).join('').toUpperCase();
  return '<span class="av" style="background:hsl(' + h + ' 46% 32%);color:hsl(' + h + ' 70% 88%)">' + esc(ini) + '</span>';
}
function vHist(){
  const d = D;
  let list = [...d.hist];
  const f = U.fq.h.toLowerCase();
  if(f) list = list.filter(h => (h.w.join(' ') + ' ' + h.l.join(' ') + ' ' + (ST[h.style] || ST.casual).n + ' ' + h.lbl).toLowerCase().indexOf(f) >= 0);
  const so = U.fs2.h;
  if(so === 'old') list.sort((a,b) => a.ts - b.ts);
  else if(so === 'long') list.sort((a,b) => b.dur - a.dur);
  else list.sort((a,b) => b.ts - a.ts);
  // A full season is thousands of cards, so they arrive in batches as the
  // list scrolls instead of all at once.
  const more = list.length > U.histN;
  const cards = list.slice(0, U.histN).map(h => '<div class="hc" data-key="h' + esc(h.id) + '">'
    + '<div class="hct"><b>Game ' + h.n + '</b><span class="sty">' + (ST[h.style] || ST.casual).n + '</span>'
    + '<time>' + new Date(h.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</time></div>'
    + '<div class="hcb"><div class="hsd w"><div class="avs">' + h.w.map(av).join('') + '</div><div class="hn">' + esc(h.w.join(' & ')) + '</div><span class="rp w">✓ Won</span></div>'
    + '<div class="hvs"><span>VS</span></div>'
    + '<div class="hsd l"><div class="avs">' + h.l.map(av).join('') + '</div><div class="hn">' + esc(h.l.join(' & ')) + '</div><span class="rp l">Lost</span></div></div>'
    + '<div class="hcf"><span>' + (h.fmt === 'doubles' ? 'Doubles' : 'Singles') + ' · ' + esc(h.lbl) + ' · ' + ms(h.dur) + '</span>'
    + '<button type="button" data-c="hswap" data-a="' + esc(h.id) + '">⇆ Swap winner</button></div></div>');
  return '<div class="vh"><h1>History</h1><p>Every match played today. Tap Swap winner if a result went down the wrong way.</p>'
    + '<button type="button" class="btn s d" data-c="histClear">Clear history</button></div>'
    + '<div class="hctl"><input type="search" class="fld" aria-label="Search match history" placeholder="Search player, style, court" value="' + esc(U.fq.h) + '" data-i="fq" data-a="h">'
    + '<select class="fld" aria-label="Sort match history" data-i="fs2" data-a="h" data-value="' + so + '">' + options(so, [['new','Newest first'],['old','Oldest first'],['long','Longest match']]) + '</select></div>'
    + (cards.length ? '<div class="bal ctr" data-bal="318|fit">' + cards.join('') + '</div>'
      + (more ? '<div class="hmore" id="st-hmore" aria-hidden="true"></div>' : '')
      : '<div class="empty hempty grow"><b>' + (d.hist.length ? 'No matches found' : 'No matches yet') + '</b>' + (d.hist.length ? 'Try a different search.' : 'Results appear here the moment you tap a winning side.') + '</div>');
}

/* =====================================================================
   Renderer: views build HTML strings and patch() morphs the live DOM to
   match, keeping elements (and so focus, scroll and animations) in place.
   ===================================================================== */
const T = {auto:0, buzz:0};
const $ = id => document.getElementById(id);
let rq = 0, rqAll = false, rqParts = new Set(), cfmOpen = false, setOpen = false;

function render(part){
  if(part) rqParts.add(part); else rqAll = true;
  if(!rq) rq = requestAnimationFrame(doRender);
}
function setU(patch){ Object.assign(U, patch); render(); }

function patch(parent, html){
  if(parent._html === html) return;
  parent._html = html;
  const t = document.createElement('template');
  t.innerHTML = html;
  morphKids(parent, t.content);
}
function morphKids(a, b){
  const nk = Array.from(b.childNodes);
  const keyed = new Map();
  for(let n = a.firstChild; n; n = n.nextSibling){ if(n.nodeType === 1){ const k = n.getAttribute('data-key'); if(k) keyed.set(k, n); } }
  for(let j = 0; j < nk.length; j++){
    const nn = nk[j], cur = a.childNodes[j] || null;
    const key = nn.nodeType === 1 ? nn.getAttribute('data-key') : null;
    let m = null;
    if(key){ m = keyed.get(key) || null; if(m && m.nodeName !== nn.nodeName) m = null; if(m) keyed.delete(key); }
    else if(cur && cur.nodeType === nn.nodeType && cur.nodeName === nn.nodeName && !(cur.nodeType === 1 && cur.getAttribute('data-key'))) m = cur;
    if(m){ if(m !== cur) a.insertBefore(m, cur); sync(m, nn); }
    else a.insertBefore(nn, cur);
  }
  while(a.childNodes.length > nk.length) a.removeChild(a.lastChild);
}
function sync(el, nn){
  if(el.nodeType !== 1){ if(el.nodeValue !== nn.nodeValue) el.nodeValue = nn.nodeValue; return; }
  // Balanced grids own their --cols; the template never sets their style.
  const bal = el.hasAttribute('data-bal');
  const na = nn.attributes;
  for(let i = 0; i < na.length; i++){
    const at = na[i];
    if(bal && at.name === 'style') continue;
    if(el.getAttribute(at.name) !== at.value) el.setAttribute(at.name, at.value);
  }
  const oa = el.attributes;
  for(let i = oa.length - 1; i >= 0; i--){
    const name = oa[i].name;
    if(bal && name === 'style') continue;
    if(!nn.hasAttribute(name)) el.removeAttribute(name);
  }
  const tag = el.nodeName;
  if(tag === 'INPUT'){
    const v = nn.getAttribute('value') || '';
    if(el.type !== 'file' && el.value !== v) el.value = v;
    return;
  }
  morphKids(el, nn);
  if(tag === 'SELECT'){ const v = nn.getAttribute('data-value'); if(v != null && el.value !== v) el.value = v; }
}

/* Even grids: pick a column count from the box's real width. Fixed sets use
   only counts that divide them ("min|4,2,1"), variable sets balance their rows
   ("min"), and long lists keep a steady card size ("min|fit"). */
function balance(){
  document.querySelectorAll('[data-bal]').forEach(el => {
    const n = el.children.length;
    const w = el.clientWidth;
    if(!n || !w) return;
    const spec = el.getAttribute('data-bal').split('|');
    const min = +spec[0];
    const gap = parseFloat(getComputedStyle(el).columnGap) || 0;
    const fit = Math.max(1, Math.floor((w + gap) / (min + gap)));
    let cols;
    if(spec[1] === 'fit') cols = fit;
    else if(spec[1]) cols = spec[1].split(',').map(Number).find(a => a <= fit && a <= n) || 1;
    else { cols = Math.min(fit, n); cols = Math.ceil(n / Math.ceil(n / cols)); }
    if(el.style.getPropertyValue('--cols') !== String(cols)) el.style.setProperty('--cols', String(cols));
  });
}

function applyVars(){
  const r = document.documentElement, light = D.theme === 'light';
  r.dataset.theme = light ? 'light' : 'dark';

  };
  Object.keys(vars).forEach(k => { if(r.style.getPropertyValue(k) !== vars[k]) r.style.setProperty(k, vars[k]); });

function shade(hex, amt){
  const h = String(hex).replace('#',''); if(h.length !== 6) return hex;
  const n = [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
  const o = n.map(v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255-v)*amt : v*(1+amt)))));
  return '#' + o.map(v => v.toString(16).padStart(2,'0')).join('');

/* Fullscreen scoreboard. The scoreboard covers the page either way; the
   browser is also asked to go truly fullscreen, like F11, so its tabs and
   address bar and the taskbar disappear too. Where the browser refuses (an
   iPhone, or an embedded frame) the cover alone still works. Leaving the

function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fsReal(on){
  const r = document.documentElement;

    let p = null;
    if(on && !fsEl()){
      const f = r.requestFullscreen || r.webkitRequestFullscreen;
      if(f) p = f.call(r);
    } else if(!on && fsEl()){
      const x = document.exitFullscreen || document.webkitExitFullscreen;
      if(x) p = x.call(document);
    }
    if(p && p.catch) p.catch(() => {});
  }catch(e){}
}

/* ---------- clock ---------- */
function tick(){
  if(!D.t.run){
    // Once a break has run out, redraw once so the courts stop saying Break.
    if(D._brkEnd && D._brkEnd < Date.now() && U.brkSeen !== D._brkEnd){ U.brkSeen = D._brkEnd; render(); }
    return;
  }
  const left = Math.max(0, Math.round((D.t.end - Date.now())/1000));
  if(left === D.t.left) return;
  D.t.left = left;
  const fired = left === 0;
  if(fired) D.t.run = false;
  save(D);
  if(fired){ render(); timeUp(); }
  else renderClock();
}
function timeUp(){
  if(D.s.o.sound) beep();
  if(D.s.o.auto){
    clearTimeout(T.auto);
    const wait = 500 + (D.s.brk || 0) * 60000;
    // Recorded so the courts can say a break is running rather than sitting
    // there looking stalled.
    set(x => { x._brkEnd = Date.now() + wait; });
    // Auto-advance rolls straight on; anything still unscored is abandoned
    // without a prompt, because nobody is standing at the screen to answer.
    T.auto = setTimeout(() => { if(D.s.o.auto) nextRound_(); }, wait);
  }
}

/* ---------- keep the screen on ---------- */
// A laptop or tablet dimming mid-match hides the clock. The browser drops the
// lock whenever the tab is hidden, so it is asked for again on return.
const WL = {lock:null, pending:false};
function applyWake(fromToggle){
  if(!('wakeLock' in navigator)) return;
  if(P.awake && !document.hidden && !WL.lock && !WL.pending){
    WL.pending = true;
    navigator.wakeLock.request('screen').then(l => {
      WL.pending = false;
      if(!P.awake){ l.release().catch(() => {}); return; }
      WL.lock = l;
      l.addEventListener('release', () => { if(WL.lock === l) WL.lock = null; });
      if(fromToggle) toast('The screen will stay on while SmashTrack is open', 'ok');
    }, () => {
      WL.pending = false;
      if(fromToggle) toast('This browser would not keep the screen on', 'bad');
    });
  } else if(!P.awake && WL.lock){
    const l = WL.lock; WL.lock = null;
    l.release().catch(() => {});
  }
}

/* ---------- buzzer ---------- */
// One shared context, reused and resumed. A new one per buzzer hits the
// browser's concurrent-context cap and goes silent after a few rounds.
const AU = {ac:null, ok:false, mel:undefined, melOk:false};
function audio(){
  try{
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return null;
    if(!AU.ac || AU.ac.state === 'closed') AU.ac = new A();
    return AU.ac;
  }catch(e){ return null; }
}
// Browsers refuse to make noise until the operator has touched the page, so
// every genuine interaction unlocks: resume, plus a one-frame silent buffer,
// which is what iOS counts as "this page has played audio".
function unlockAudio(){
  primeMedia();
  const c = audio(); if(!c) return null;
  try{
    if(c.state !== 'running' && c.resume) c.resume().catch(() => {});
    const s = c.createBufferSource();
    s.buffer = c.createBuffer(1, 1, 22050);
    s.connect(c.destination);
    s.start(0);
    AU.ok = true;
    if(!c.__stWatch){
      c.__stWatch = true;
      c.addEventListener('statechange', () => { if(c.state !== 'running' && !document.hidden){ try{ c.resume(); }catch(e){} } });
    }
  }catch(e){}
  return c;
}
// A real <audio> element playing an in-memory WAV of the same three notes:
// a second path that phones often still allow when WebAudio is suspended.
function mediaEl(){
  if(AU.mel !== undefined) return AU.mel;
  AU.mel = null;
  try{
    const sr = 22050, n = Math.round(sr * 0.9);
    const b = new ArrayBuffer(44 + n*2), v = new DataView(b);
    const wr = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
    wr(0,'RIFF'); v.setUint32(4, 36+n*2, true); wr(8,'WAVE'); wr(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    wr(36,'data'); v.setUint32(40, n*2, true);
    const seg = [[0,.26,880],[.3,.56,660],[.6,.86,990]];
    for(let i = 0; i < n; i++){
      const t = i/sr; let a = 0;
      for(let k = 0; k < seg.length; k++){
        const g = seg[k];
        if(t >= g[0] && t < g[1]){
          const env = Math.min(1,(t-g[0])/.012) * Math.min(1,(g[1]-t)/.05);
          a = (Math.sin(2*Math.PI*g[2]*t) >= 0 ? 1 : -1) * .3 * env;
        }
      }
      v.setInt16(44+i*2, Math.max(-1, Math.min(1, a)) * 32767, true);
    }
    const el = new Audio(URL.createObjectURL(new Blob([b], {type:'audio/wav'})));
    el.preload = 'auto'; el.playsInline = true;
    AU.mel = el;
  }catch(e){}
  return AU.mel;
}
function primeMedia(){
  if(AU.melOk) return;
  const el = mediaEl(); if(!el) return;
  try{
    el.muted = true;
    const back = () => { try{ el.pause(); el.currentTime = 0; }catch(e){} el.muted = false; };
    const p = el.play();
    if(p && p.then) p.then(() => { back(); AU.melOk = true; }, () => { el.muted = false; });
    else { back(); AU.melOk = true; }
  }catch(e){ try{ el.muted = false; }catch(e2){} }
}
function mediaPlay(){
  const el = mediaEl();
  if(!el) return Promise.resolve(false);
  try{
    el.muted = false; el.currentTime = 0;
    const p = el.play();
    if(p && p.then) return p.then(() => true, () => false);
    return Promise.resolve(true);
  }catch(e){ return Promise.resolve(false); }
}
function beep(){
  const c = audio();
  if(c && c.state === 'running' && tone(c)) return;
  let done = false;
  const go2 = () => {
    if(done || !c || c.state !== 'running') return false;
    if(!tone(c)) return false;
    done = true; return true;
  };
  if(c){ try{ const p = c.resume && c.resume(); if(p && p.then) p.then(go2, () => {}); }catch(e){} }
  setTimeout(() => {
    if(done || go2()) return;
    mediaPlay().then(ok => { if(!ok && !done) soundFail(); });
  }, 300);
}
function tone(c){
  try{
    const t0 = c.currentTime;
    [[0,880],[.3,660],[.6,990]].forEach(([off, hz]) => {
      const o = c.createOscillator(), g = c.createGain(), s = t0 + off;
      o.connect(g); g.connect(c.destination); o.type = 'square'; o.frequency.value = hz;
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(.18, s + .012);
      g.gain.exponentialRampToValueAtTime(.0001, s + .26);
      o.start(s); o.stop(s + .3);
    });
    return true;
  }catch(e){ return false; }
}
// Silent failure is the worst outcome on a gym floor, so a blocked buzzer
// still flashes the screen and says why.
function soundFail(){
  toast('Time is up. This browser blocked the buzzer — tap the screen once and it will sound from now on.', 'bad');
  setU({buzz:uid()});
  clearTimeout(T.buzz);
  T.buzz = setTimeout(() => setU({buzz:null}), 4000);
}

/* =====================================================================
   Events: one delegated listener per type. Buttons name their action in
   data-c; shortcuts call the very same functions.
   ===================================================================== */
const STEP_LIMITS = {'casual.rounds':[0,30], 'casual.cap':[0,30], 'casual.rest':[0,8], 'kotc.cap':[0,10], 'kotc.cool':[0,6], 'league.rounds':[1,2]};
const C = {
  noop(){},
  // navigation and home
  go: el => go(el.dataset.a),
  land: el => { dismissHome(); go(el.dataset.a); },
  // Always lands on the dashboard, whatever view was last open.
  start: () => { dismissHome(); go('dash'); },
  home: () => setU({welcome:true, settings:false}),
  setTog: (el, e) => setU({settings:!U.settings, setKbd:e.detail === 0}),
  setGo: el => { if(U.welcome) dismissHome(); go(el.dataset.a); },
  setHome: () => setU({settings:false, welcome:true}),
  pref: el => { const k = el.dataset.a; setPref(k, el.dataset.v ? el.dataset.v : !P[k]); },
  theme: el => { const t = el.dataset.a; if(D.theme !== t) set(x => { x.theme = t; }); },
  testBuzz: () => { unlockAudio(); beep(); },
  // clock and rounds
  tPlay: () => timerToggle(),
  tReset: () => set(x => { x._invite = false; x.t.run = false; x.t.left = x.t.len; }),
  tPlus: () => set(x => { x._invite = false; x.t.left += 60; if(x.t.run) x.t.end = Date.now() + x.t.left*1000; }),
  tMinus: () => set(x => { x._invite = false; x.t.left = Math.max(0, x.t.left - 60); if(x.t.run) x.t.end = Date.now() + x.t.left*1000; }),
  gen: () => nextRound(),
  subTog: () => swapToggle(),
  clear: () => clearCourts(),
  newComp: () => set(x => { x.comp = null; x.round = 0; x.courts.forEach(c => { c.m = null; }); }, 'Ready for a new competition'),
  win: el => { if(!D.swap) win(el.dataset.a, el.dataset.v); },
  subPick: el => swapPick(el.dataset.a),
  courtSwap: el => courtSwap(el.dataset.a),
  toggle: el => togglePlayer(el.dataset.a),
  unpair: el => unpair(el.dataset.a),
  // session
  endSess: () => endSession(),
  dl: () => downloadSeason(),
  openFile: () => $('st-file').click(),
  erase: () => hardReset(),
  addPlayer: () => addPlayer(),
  selTog: () => setU({selMode:!U.selMode, sel:[], ren:''}),
  pchip: el => {
    const id = el.dataset.a;
    if(U.selMode) setU({sel:U.sel.indexOf(id) >= 0 ? U.sel.filter(x => x !== id) : [...U.sel, id], ren:''});
    else togglePlayer(id);
  },
  selAll: () => setU({sel:sessList(D).map(p => p.id)}),
  selClear: () => setU({sel:[]}),
  selAct: () => { const s = U.sel; set(x => s.forEach(id => { const p = Pl(x,id); if(p) p.status = 'in'; }), s.length + ' activated', 'ok'); },
  selDeact: () => { const s = U.sel; set(x => s.forEach(id => { const p = Pl(x,id); if(p) p.status = 'away'; }), s.length + ' set to away'); },
  selPair: () => {
    const s = U.sel;
    if(s.length < 2){ toast('Select two or more players first', 'bad'); return; }
    set(x => { for(let i = 0; i + 1 < s.length; i += 2){ [s[i],s[i+1]].forEach(k => { const m = x.pairs[k]; if(m){ delete x.pairs[m]; delete x.pairs[k]; } }); x.pairs[s[i]] = s[i+1]; x.pairs[s[i+1]] = s[i]; } }, 'Locked doubles teams', 'ok');
  },
  renSave: () => {
    const v = U.ren.trim().slice(0, 40), id = U.sel[0];
    if(!v || U.sel.length !== 1) return;
    if(D.players.some(p => p.id !== id && p.name.toLowerCase() === v.toLowerCase())){ toast('That name is already on the roster', 'bad'); return; }
    U.ren = '';
    set(x => { const p = Pl(x, id); if(p) p.name = v; }, 'Renamed');
  },
  selRemove: () => {
    const s = U.sel;
    if(!s.length){ toast('Nobody selected', 'bad'); return; }
    ask('Remove ' + s.length + ' player' + (s.length > 1 ? 's' : '') + '?', 'They are deleted from this session along with their records and locked pairs. Match history is kept.', 'Remove', () => removePlayers(s));
  },
  fmt: el => set(x => { x.s.fmt = el.dataset.a; }),
  courts: el => setCourts(D.courts.length + +el.dataset.v),
  len: el => setLen(D.s.len + +el.dataset.v),
  brk: el => setBrk(D.s.brk + .5 * +el.dataset.v),
  opt: el => { const k = el.dataset.a; if(k === 'sound') unlockAudio(); set(x => { x.s.o[k] = !x.s.o[k]; }); },
  style: el => pickStyle(el.dataset.a),
  sStep: el => {
    const key = el.dataset.a, [g,k] = key.split('.'), lim = STEP_LIMITS[key] || [0, 30];
    const v = clamp(D.s[g][k] + +el.dataset.v, lim[0], lim[1]);
    setS(x => { x[g][k] = v; if(key === 'kotc.cap' && !v) x.kotc.cool = 0; });
  },
  sSeg: el => { const [g,k] = el.dataset.k.split('.'); const v = el.dataset.a; setS(x => { x[g][k] = v; }); },
  sTog: el => { const [g,k] = el.dataset.a.split('.'); setS(x => { x[g][k] = !x[g][k]; }); },
  // scoreboard
  sbPt: el => SB.add(el.dataset.a),
  sbUndo: el => SB.undoSide(el.dataset.a),
  sbReset: () => SB.reset(),
  sbSwap: () => SB.swap(),
  fsTog: () => fsSet(!U.fs),
  // stats and history
  statsReset: () => ask('Reset all stats?', 'Every played, won, lost and streak count goes back to zero. Players and match history stay exactly as they are.', 'Reset stats',
    () => set(x => x.players.forEach(p => { p.games = 0; p.wins = 0; p.losses = 0; p.streak = 0; p.best = 0; }), 'Stats reset')),
  hswap: el => { const h = D.hist.find(x => x.id === el.dataset.a); if(!h) return; if(h.comp) toast('Competition results follow the bracket. Reset the round instead.', 'bad'); else hswap(h.id); },
  histClear: () => ask('Clear match history?', 'All ' + D.hist.length + ' recorded matches are deleted. Player stats stay as they are.', 'Clear history',
    () => set(x => { x.hist = []; }, 'History cleared')),
  // about
  resetKeys: () => resetKeys(),
  listen: el => { const id = el.dataset.a; setU({listen:U.listen === id ? null : id, kmsg:''}); },
  // dialog
  cfmCancel: () => closeDlg(),
  cfmOk: () => { const f = U.cfm && U.cfm.onOk; U.cfm = null; render(); if(f) f(); }
};

document.addEventListener('click', e => {
  const t = e.target;
  if(U.settings && !(t.closest && t.closest('#st-set, .gear'))) setU({settings:false});
  const el = t.closest && t.closest('[data-c]');
  if(!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const f = C[el.getAttribute('data-c')];
  if(f) f(el, e);
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.i;
  if(k === 'nameIn') U.nameIn = el.value;
  else if(k === 'ren') U.ren = el.value;
  else if(k === 'fq'){ U.fq = Object.assign({}, U.fq, {[el.dataset.a]:el.value}); U.histN = 120; render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'st-file'){ const f = el.files && el.files[0]; el.value = ''; importFile(f); return; }
  if(el.dataset && el.dataset.i === 'fs2'){ U.fs2 = Object.assign({}, U.fs2, {[el.dataset.a]:el.value}); U.histN = 120; render(); }
});
// Drag one name onto another to lock a doubles team.
const DT = 'text/x-smashtrack-player';
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-drag]'); if(!el) return;
  try{ e.dataTransfer.setData(DT, el.dataset.drag); e.dataTransfer.effectAllowed = 'link'; }catch(x){}
});
document.addEventListener('dragover', e => {
  const el = e.target.closest && e.target.closest('[data-drag]');
  if(el && e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf(DT) >= 0) e.preventDefault();
});
document.addEventListener('drop', e => {
  const el = e.target.closest && e.target.closest('[data-drag]'); if(!el) return;
  let src = ''; try{ src = e.dataTransfer.getData(DT); }catch(x){}
  if(!src) return;
  e.preventDefault();
  if(src !== el.dataset.drag) pair(src, el.dataset.drag);
});

function onKey(e){
  if(e.isComposing) return;
  // Rebinding swallows the whole keystroke, including keys that would
  // otherwise scroll or submit.
  if(U.listen){ e.preventDefault(); bindKey(U.listen, e); return; }
  if(e.defaultPrevented) return;
  const t = e.target;
  if(U.cfm && e.key === 'Tab'){ trapTab(e); return; }
  if(t && t.dataset && t.dataset.enter && e.key === 'Enter'){ e.preventDefault(); const f = C[t.dataset.enter]; if(f) f(t, e); return; }
  if(t && (/^(input|textarea|select|option)$/i.test(t.tagName) || t.isContentEditable)) return;
  // A real Escape always gets you out of a dialog, the settings panel or
  // fullscreen, whatever it happens to be bound to.
  if(e.key === 'Escape' && (U.cfm || U.fs || U.settings)){ e.preventDefault(); escape(); return; }
  // Tap areas that are not real buttons still answer Enter and Space when
  // someone has tabbed to them.
  if((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.c && t.tagName !== 'BUTTON'){
    let tabbed = true; try{ tabbed = t.matches(':focus-visible'); }catch(x){}
    if(tabbed){ e.preventDefault(); t.click(); return; }
  }
  const tk = tok(e);
  if(!tk) return;
  const act = keymap(D)[tk];
  if(!act) return;
  if(U.cfm) return;
  // Space and Enter belong to a control the user actually tabbed to. If focus
  // only landed there from a mouse click, the documented shortcut still wins.
  if(tk === 'space' || tk === 'enter'){
    const el = (t && t.closest) ? t.closest('button,a[href],[role="button"],[tabindex]') : null;
    if(el){
      let tabbed = true;
      try{ tabbed = el.matches(':focus-visible'); }catch(x){}
      if(tabbed) return;
      if(el.blur) el.blur();
    }
  }
  e.preventDefault();
  runAct(act);
}
function runAct(id){
  if(id.slice(0,2) === 'v.'){ if(U.welcome) dismissHome(); go(id.slice(2)); return; }
  // On the home screen only the go-to keys act, so nothing changes unseen.
  if(U.welcome) return;
  if(id === 'timer'){ timerToggle(); return; }
  if(id === 'round'){ nextRound(); return; }
  // Fullscreen is documented as "fullscreen scoreboard", so take them there too.
  if(id === 'fs'){ const on = !(U.fs && D.v === 'score'); go('score'); fsSet(on); return; }
  const acts = {pta:() => SB.add('a'), ptb:() => SB.add('b'), undo:SB.undo, sbreset:SB.reset, swap:SB.swap, save:downloadSeason};
  if(acts[id]) acts[id]();
}

/* ---------- start-up ---------- */
function boot(){
  P = loadPrefs();
  D = load();
  U = {
    w:window.innerWidth, welcome:homeOnLoad(), settings:false, setKbd:false, setReturn:false,
    fs:false, selMode:false, sel:[], nameIn:'', ren:'',
    fq:{p:'', s:'', h:''}, fs2:{p:'session', s:'wins', h:'new'},
    listen:null, kmsg:'', tst:[], cfm:null, preCfm:null, saveErr:null, buzz:null, vk:0, brkSeen:0, histN:120
  };
  window.addEventListener('keydown', onKey);
  ['fullscreenchange','webkitfullscreenchange'].forEach(t => document.addEventListener(t, () => { if(!fsEl() && U.fs) setU({fs:false}); }));
  window.addEventListener('resize', () => { if(U.w !== window.innerWidth){ U.w = window.innerWidth; render(); } else balance(); });
  // Left attached for the whole session on purpose: a phone suspends the
  // context again every time the screen sleeps.
  ['pointerdown','touchend','keydown','click'].forEach(t => window.addEventListener(t, unlockAudio, {passive:true, capture:true}));
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){ if(AU.ok || AU.ac) unlockAudio(); applyWake(); render(); }
  });
  window.addEventListener('beforeunload', e => {
    if(U.erasing) return;
    if(dirty(D) && D.hist.length){ e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('storage', e => {
    // Another tab of this app changed the session: follow it rather than
    // overwrite it on the next save.
    if(e.key === K && e.newValue){ try{ const d = sanitize(JSON.parse(e.newValue)); if(d){ d.v = D.v; D = d; render(); } }catch(x){} }
  });
  if('ResizeObserver' in window){
    let lastW = 0;
    new ResizeObserver(en => {
      const w = Math.round(en[0].contentRect.width);
      if(w === lastW) return;
      lastW = w;
      if(window.innerWidth !== U.w) render(); else balance();
    }).observe($('st-main'));
  }
  render();
  applyWake();
  if(restored) toast('The last save could not be read, so this came back from a backup', 'bad');
  else if(loadFail) toast('The saved session could not be read, so this started fresh', 'bad');
  try{ if(!localStorage.getItem(K)) save(D); }catch(e){}
  setInterval(tick, 250);
  // A break that was running when the page closed still rolls on afterwards.
  if(D.s.o.auto && D._brkEnd && D._brkEnd > Date.now()){
    T.auto = setTimeout(() => { if(D.s.o.auto) nextRound_(); }, D._brkEnd - Date.now());
  }
  // The first-paint cover fades once the interface is genuinely up.
  const sp = $('st-splash');
  if(sp){
    const wait = Math.max(0, 320 - performance.now());
    setTimeout(() => {
      sp.style.pointerEvents = 'none'; sp.style.opacity = '0';
      setTimeout(() => sp.remove(), 430);
    }, wait);
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
